name: credential-guard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: No credentials in tracked files
        run: |
          set -e
          if git grep -nE 'packageSource[C]redentials|ClearText[P]assword|gh[p]_|github_[p]at_' -- ':!.github/workflows/credential-guard.yml'; then
            echo "::error::Credential material is committed; revoke it and remove it from the tree."
            exit 1
          fi
