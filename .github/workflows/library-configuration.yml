name: Configuration
on:
  push:
    paths:
      - "libraries/Configuration/**"
      - "!libraries/Configuration/**/*.slnx"
      - "!libraries/Configuration/**/*.md"
      - ".github/workflows/library-configuration.yml" # When Pipeline File Changes
permissions:
  contents: read

# A newer push to the same branch (or pull request) supersedes this run, so the older run is
# cancelled instead of holding runner slots: the organization's plan runs at most 20 jobs at once,
# 5 of them macOS. Every main commit keeps its own run, because the run id makes its group unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "${{ matrix.projects }} [${{ matrix.os }}]"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: false
    strategy:
      # Every leg reports its own result: with fail-fast, one failing leg cancels the rest of the
      # matrix and leaves the other projects without a signal (#1093).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects: [
            'Assimalign.Cohesion.Configuration',
            'Assimalign.Cohesion.Configuration.CommandLine',
            'Assimalign.Cohesion.Configuration.EnvironmentVariables',
            'Assimalign.Cohesion.Configuration.FileSystem',
            'Assimalign.Cohesion.Configuration.Ini',
            'Assimalign.Cohesion.Configuration.Json',
            'Assimalign.Cohesion.Configuration.Xml',
          ]
    steps:
      - uses: actions/checkout@v7
        name: "Checkout: ${{ matrix.projects }}"

      - uses: ./.github/actions/build
        name: "Running Build & Tests: ${{ matrix.projects }}"
        with:
          area: 'libraries'
          category: 'Configuration'
          project: ${{ matrix.projects }}
