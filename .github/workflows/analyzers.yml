name: Analyzers
on:
  push:
    paths:
      - "analyzers/**"
      - "build/**"
      - "libraries/Core/**"
      - "libraries/ObjectMapping/**"
      - "libraries/DependencyInjection/Assimalign.Cohesion.DependencyInjection/**"
      - "libraries/Http/Assimalign.Cohesion.Http.ClientFactory/**"
      # Owner decision 34 (#1380): the Web feature packages declare the builder.Services.Add<Feature>
      # component integrations IntegrationCheck projects, so a change to one rebuilds the canary.
      - "resources/Web/Assimalign.Cohesion.Web.Antiforgery/src/**"
      - "resources/Web/Assimalign.Cohesion.Web.Authentication/src/**"
      - "resources/Web/Assimalign.Cohesion.Web.Authorization/src/**"
      - "resources/Web/Assimalign.Cohesion.Web.ErrorHandling/src/**"
      - "resources/Web/Assimalign.Cohesion.Web.OpenApi/src/**"
      - "resources/Web/Assimalign.Cohesion.Web.Routing/src/**"
      - "resources/Web/Assimalign.Cohesion.Web.Serialization/src/**"
      - "resources/Web/Assimalign.Cohesion.Web.Validation/src/**"
      - ".github/workflows/analyzers.yml" # When Pipeline File Changes
      # Shared build infrastructure that every project in this workflow compiles with.
      - ".github/actions/build/**"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "analyzers/Directory.Build.props"
      - "analyzers/Directory.Build.targets"
  workflow_dispatch:
    inputs:
      all-os:
        description: Also run the Windows and macOS legs, which otherwise run only on main.
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch (or pull request) supersedes this run, so the older run is
# cancelled instead of holding runner slots: the organization's plan runs at most 20 jobs at once,
# 5 of them macOS. Every main commit keeps its own run, because the run id makes its group unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "${{ github.workflow }} [${{ matrix.os }}]"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: false
    strategy:
      # Every leg reports its own result: with fail-fast, one failing leg cancels the rest of the
      # matrix and leaves the other projects without a signal (#1093).
      fail-fast: false
      matrix:
        # Windows and macOS legs run on main, or on a manual run with all-os set; other pushes run
        # Linux only, because the organization's plan runs at most 5 macOS jobs at once.
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || inputs.all-os) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        # One leg per OS builds and tests the whole area: the inner list is a single matrix value
        # that .github/actions/build receives whole. The release inventory guard reads this list.
        projects: [[
            "Assimalign.Cohesion.SourceGeneration.OpenApi",
            "Assimalign.Cohesion.SourceGeneration.ObjectMapping",
            "Assimalign.Cohesion.SourceGeneration",
            "Assimalign.Cohesion.SourceGeneration.Database",
            "Assimalign.Cohesion.SourceGeneration.Web"
          ]]
    steps:
      - uses: actions/checkout@v7
        name: Checkout

      # The analyzer projects sit directly under analyzers/, so the action takes no category.
      - uses: ./.github/actions/build
        name: Build and test
        with:
          area: 'analyzers'
          projects: ${{ toJSON(matrix.projects) }}

  integration-check:
    name: "IntegrationCheck [ubuntu-latest]"
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
        name: "Checkout: IntegrationCheck"

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build build tasks
        run: dotnet build "./build/Tasks/Assimalign.Cohesion.Build.Tasks.csproj" --configuration Release

      - name: Verify shared-source module selection
        shell: pwsh
        run: ./build/tests/Test-CohesionSharedSource.ps1

      - name: "Build: IntegrationCheck"
        run: dotnet build "./build/IntegrationCheck/Assimalign.Cohesion.IntegrationCheck.csproj" --configuration Release
