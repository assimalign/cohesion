name: Http
on:
  push:
    paths:
      - 'build/Tasks/**'
      - 'build/Targets/Build.CodeGeneration.*'
      - 'build/TestSupport/**'
      - "libraries/Http/**"
      - "!libraries/Http/**/*.slnx"
      - "!libraries/Http/**/*.md"
      - ".github/workflows/library-http.yml" # When Pipeline File Changes
permissions:
  contents: read

# A newer push to the same branch (or pull request) supersedes this run, so the older run is
# cancelled instead of holding runner slots: the organization's plan runs at most 20 jobs at once,
# 5 of them macOS. Every main commit keeps its own run, because the run id makes its group unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "${{ matrix.projects }} [${{ matrix.os }}]"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: false
    strategy:
      # Every leg reports its own result: with fail-fast, one failing leg cancels the rest of the
      # matrix and leaves the other projects without a signal (#1093).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects: [
            "Assimalign.Cohesion.Http",
            "Assimalign.Cohesion.Http.Sessions",
            "Assimalign.Cohesion.Http.Forms",
            "Assimalign.Cohesion.Http.ClientFactory",
            "Assimalign.Cohesion.Http.Connections",
            "Assimalign.Cohesion.Http.ExtendedConnect",
            "Assimalign.Cohesion.Http.ProtocolUpgrade",
            "Assimalign.Cohesion.Http.RequestLimits",
            "Assimalign.Cohesion.Http.Cookies",
            "Assimalign.Cohesion.Http.Antiforgery",
            "Assimalign.Cohesion.Http.Forwarded",
            "Assimalign.Cohesion.Http.Streaming",
            "Assimalign.Cohesion.Http.DigestFields",
            "Assimalign.Cohesion.Http.InterimResponses",
            "Assimalign.Cohesion.Http.ServerSentEvents",
            "Assimalign.Cohesion.Http.Tls",
            "Assimalign.Cohesion.Http.WebSockets"
          ]
    steps:
      - uses: actions/checkout@v7
        name: "Checkout: ${{ matrix.projects }}"

      - uses: ./.github/actions/build
        name: "Running Build & Tests: ${{ matrix.projects }}"
        with:
          area: 'libraries'
          category: 'Http'
          project: ${{ matrix.projects }}
