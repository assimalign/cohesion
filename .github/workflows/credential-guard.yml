name: credential-guard

on: [push, pull_request]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No credentials in tracked files
        run: |
          set -e
          # Token shapes anywhere in the tree; NuGet credential elements anywhere except prose
          # (Markdown may name the elements as words, for example when a document records a credential remediation).
          if git grep -nE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' -- ':!.github/workflows/credential-guard.yml' \
             || git grep -nE 'packageSourceCredentials|ClearTextPassword' -- ':!.github/workflows/credential-guard.yml' ':!*.md'; then
            echo "::error::credential material is committed; revoke it and remove it from the tree"
            exit 1
          fi
