name: Log Space
on:
  push:
    paths:
      - "resources/LogSpace/**"
      - "!resources/LogSpace/**/*.slnx"
      - "!resources/LogSpace/**/*.md"
      # The area's acceptance fixture lives in the fixtures/ folder of the project whose
      # tests drive it (.claude/rules/resource-areas.md) - still this area's input.
      - "libraries/ApplicationModel/Assimalign.Cohesion.ApplicationModel.Gateway/fixtures/Assimalign.Cohesion.LogSpace.SinkHost/**"
      - ".github/workflows/resource-log-space.yml" # When Pipeline File Changes

permissions:
  contents: read

# A newer push to the same branch (or pull request) supersedes this run, so the older run is
# cancelled instead of holding runner slots: the organization's plan runs at most 20 jobs at once,
# 5 of them macOS. Every main commit keeps its own run, because the run id makes its group unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Every leg reports its own result: with fail-fast, one failing leg cancels the rest of the
      # matrix and leaves the other projects without a signal (#1093).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects: ["Assimalign.Cohesion.LogSpace", "Assimalign.Cohesion.LogSpace.ApplicationModel", "Assimalign.Cohesion.LogSpace.Hosting"]
    steps:
      - uses: actions/checkout@v7
        name: "Checkout: ${{ matrix.projects }}"

      - uses: ./.github/actions/build
        name: "Running Build & Tests: ${{ matrix.projects }}"
        with:
          area: "resources"
          category: "LogSpace"
          project: ${{ matrix.projects }}

  sink-sample:
    runs-on: ${{ matrix.os }}
    strategy:
      # Every leg reports its own result: with fail-fast, one failing leg cancels the rest of the
      # matrix and leaves the other projects without a signal (#1093).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects: ['Assimalign.Cohesion.LogSpace.SinkHost']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build build/Tasks -c Release
      - run: dotnet build libraries/ApplicationModel/Assimalign.Cohesion.ApplicationModel.Gateway/fixtures/${{ matrix.projects }}/${{ matrix.projects }}.csproj -c Release
