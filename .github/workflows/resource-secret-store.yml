name: Secret Store
on:
  push:
    paths:
      # The area glob covers SecretStore.ApplicationModel.Orchestration. Its tests run an application set
      # through a real ApplicationModel.Gateway (StoreGateway : ApplicationGateway), so a change to
      # the provider seams, the gateway that resolves through them, or Core reruns them.
      - 'resources/SecretStore/**'
      - '!resources/SecretStore/**/*.slnx'
      - '!resources/SecretStore/**/*.md'
      - 'libraries/ApplicationModel/**'
      - 'libraries/Core/**'
      - '.github/workflows/resource-secret-store.yml'        # When Pipeline File Changes

permissions:
  contents: read

# A newer push to the same branch (or pull request) supersedes this run, so the older run is
# cancelled instead of holding runner slots: the organization's plan runs at most 20 jobs at once,
# 5 of them macOS. Every main commit keeps its own run, because the run id makes its group unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Every leg reports its own result: with fail-fast, one failing leg cancels the rest of the
      # matrix and leaves the other projects without a signal (#1093).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects: [
            'Assimalign.Cohesion.SecretStore',
            'Assimalign.Cohesion.SecretStore.ApplicationModel',
            'Assimalign.Cohesion.SecretStore.ApplicationModel.Orchestration',
            'Assimalign.Cohesion.SecretStore.Client',
            'Assimalign.Cohesion.SecretStore.Hosting'
        ]
    steps:
      - uses: actions/checkout@v7
        name: "Checkout: ${{ matrix.projects }}"

      - uses: ./.github/actions/build
        name: "Running Build & Tests: ${{ matrix.projects }}"
        with:
          area: 'resources'
          category: 'SecretStore'
          project: ${{ matrix.projects }}
