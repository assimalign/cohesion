name: IdentityModel
on:
  push:
    paths:
      - 'libraries/IdentityModel/**'
      - '!libraries/IdentityModel/**/*.slnx'
      - '!libraries/IdentityModel/**/*.md'
      - '.github/workflows/library-identity-model.yml'                 # When Pipeline File Changes
      # Shared build infrastructure that every project in this workflow compiles with.
      - '.github/actions/build/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'libraries/Directory.Build.props'
      - 'libraries/Directory.Build.targets'
      - 'build/Build.props'
      - 'build/Build.targets'
      - 'build/Targets/**'
      - 'build/Tasks/**'
  workflow_dispatch:
    inputs:
      all-os:
        description: Also run the Windows and macOS legs, which otherwise run only on main.
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch (or pull request) supersedes this run, so the older run is
# cancelled instead of holding runner slots: the organization's plan runs at most 20 jobs at once,
# 5 of them macOS. Every main commit keeps its own run, because the run id makes its group unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "${{ github.workflow }} [${{ matrix.os }}]"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Every leg reports its own result: with fail-fast, one failing leg cancels the rest of the
      # matrix and leaves the other projects without a signal (#1093).
      fail-fast: false
      matrix:
        # Windows and macOS legs run on main, or on a manual run with all-os set; other pushes run
        # Linux only, because the organization's plan runs at most 5 macOS jobs at once.
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || inputs.all-os) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        # One leg per OS builds and tests the whole area: the inner list is a single matrix value
        # that .github/actions/build receives whole. The release inventory guard reads this list.
        projects: [[
            'Assimalign.Cohesion.IdentityModel',
            'Assimalign.Cohesion.IdentityModel.Protocols',
            'Assimalign.Cohesion.IdentityModel.Protocols.OpenIdConnect',
            'Assimalign.Cohesion.IdentityModel.Protocols.Saml',
            'Assimalign.Cohesion.IdentityModel.Token',
            'Assimalign.Cohesion.IdentityModel.Token.JsonWebToken',
            'Assimalign.Cohesion.IdentityModel.Token.Saml'
        ]]
    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - uses: ./.github/actions/build
        name: Build and test
        with:
          area: 'libraries'
          category: 'IdentityModel'
          projects: ${{ toJSON(matrix.projects) }}

  # The AOT smoke is a plain build (no native publish). The family's Directory.Build.props
  # promotes the trim/AOT analyzer diagnostics to errors in every family src project, so
  # building the sample (which references all seven) re-compiles the family with that gate
  # plus the sample's own promoted analyzers over the exercised surfaces — the continuous
  # half of the family's NativeAOT evidence. The point-in-time publish-and-run evidence is
  # recorded in the family docs (root DESIGN.md, AOT posture).
  aot-analyzers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: "Checkout: AotSample"

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore build tasks
        shell: pwsh
        run: dotnet restore "./build/Tasks/Assimalign.Cohesion.Build.Tasks.csproj"

      - name: Build build tasks
        shell: pwsh
        run: dotnet build "./build/Tasks/Assimalign.Cohesion.Build.Tasks.csproj" --configuration Release --no-restore

      - name: Build AotSample (trim/AOT analyzers as errors)
        shell: pwsh
        run: dotnet build "./libraries/IdentityModel/Assimalign.Cohesion.IdentityModel/samples/Assimalign.Cohesion.IdentityModel.AotSample/Assimalign.Cohesion.IdentityModel.AotSample.csproj" --configuration Release
