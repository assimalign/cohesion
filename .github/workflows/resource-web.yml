name: Web
on:
  push:
    paths:
      # Covers Web.Testing/fixtures/Assimalign.Cohesion.Web.TestHost. The HttpsHost fixture is
      # listed separately because it belongs to the Gateway's tests, not to this area
      # (.claude/rules/resource-areas.md) — the Web runtime it composes is still this area's.
      - 'resources/Web/**'
      - '!resources/Web/**/*.slnx'
      - '!resources/Web/**/*.md'
      - 'libraries/ApplicationModel/Assimalign.Cohesion.ApplicationModel.Gateway/fixtures/Assimalign.Cohesion.Web.HttpsHost/**'
      - '.github/workflows/resource-web.yml'        # When Pipeline File Changes

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Every leg reports its own result. With fail-fast, one failing project cancelled the rest
      # of the matrix and left a branch with no signal for the other Web libraries (#1093).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Every buildable Web project is listed so the area's dependency-rule guard
        # (build/Targets/Build.Rules.targets, COHRES001/COHRES002) executes in CI for
        # each of them - most importantly Web.Hosting and the NuGet-only
        # Web.ApplicationModel control-plane package.
        projects: [
            'Assimalign.Cohesion.Web',
            'Assimalign.Cohesion.Web.Antiforgery',
            'Assimalign.Cohesion.Web.ApplicationModel',
            'Assimalign.Cohesion.Web.Api',
            'Assimalign.Cohesion.Web.Authentication',
            'Assimalign.Cohesion.Web.Authentication.Bearer',
            'Assimalign.Cohesion.Web.Authentication.Cookie',
            'Assimalign.Cohesion.Web.Authorization',
            'Assimalign.Cohesion.Web.Caching',
            'Assimalign.Cohesion.Web.Compression',
            'Assimalign.Cohesion.Web.CookiePolicy',
            'Assimalign.Cohesion.Web.Cors',
            'Assimalign.Cohesion.Web.Diagnostics',
            'Assimalign.Cohesion.Web.ErrorHandling',
            'Assimalign.Cohesion.Web.Forms',
            'Assimalign.Cohesion.Web.ForwardedHeaders',
            'Assimalign.Cohesion.Web.Health',
            'Assimalign.Cohesion.Web.HostFiltering',
            'Assimalign.Cohesion.Web.Hosting',
            'Assimalign.Cohesion.Web.Hosting.Health',
            'Assimalign.Cohesion.Web.Hosting.Resources',
            'Assimalign.Cohesion.Web.HttpsPolicy',
            'Assimalign.Cohesion.Web.OpenApi',
            'Assimalign.Cohesion.Web.ProblemDetails',
            'Assimalign.Cohesion.Web.Query',
            'Assimalign.Cohesion.Web.RateLimiting',
            'Assimalign.Cohesion.Web.RequestTimeouts',
            'Assimalign.Cohesion.Web.Rewrite',
            'Assimalign.Cohesion.Web.Routing',
            'Assimalign.Cohesion.Web.SecurityHeaders',
            'Assimalign.Cohesion.Web.Serialization',
            'Assimalign.Cohesion.Web.Sessions',
            'Assimalign.Cohesion.Web.StaticFiles',
            'Assimalign.Cohesion.Web.Testing',
            'Assimalign.Cohesion.Web.Validation'
        ]
    steps:
      - uses: actions/checkout@v4
        name: "Checkout: ${{ matrix.projects }}"

      - uses: ./.github/actions/build
        name: "Running Build & Tests: ${{ matrix.projects }}"
        with:
          area: 'resources'
          category: 'Web'
          project: ${{ matrix.projects }}

  https-sample:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects: ['Assimalign.Cohesion.Web.HttpsHost']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet build build/Tasks -c Release
      - run: dotnet build libraries/ApplicationModel/Assimalign.Cohesion.ApplicationModel.Gateway/fixtures/${{ matrix.projects }}/${{ matrix.projects }}.csproj -c Release

  # NativeAOT guard (#1052): a representative Web application — routing (groups, branching, the
  # static-file fallback), URL rewrite and redirect rules (#782),
  # source-generated typed binding and JSON, error handling, Cookie + JWT
  # Bearer, authorization, antiforgery, cookie policy, security headers, static files, compression,
  # CORS, rate limiting, request timeouts, handler return values, request validation, file uploads and
  # the OpenAPI document — published with PublishAot. The guard promotes the trim/AOT analyzer
  # diagnostics and ILC's per-assembly summaries (IL2104/IL3053) to errors, so a trim or AOT warning in
  # any Web library it reaches fails the publish; the smoke run then exercises every feature over real
  # HTTP and fails the job on the first failed check.
  aot-guard:
    name: "Web NativeAOT guard [ubuntu-latest]"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet build build/Tasks -c Release
      - name: Publish the guard with NativeAOT (trim/AOT warnings are errors)
        run: dotnet publish resources/Web/Assimalign.Cohesion.Web.Hosting/samples/Assimalign.Cohesion.Web.AotGuard/Assimalign.Cohesion.Web.AotGuard.csproj -c Release -r linux-x64 -o "${{ runner.temp }}/web-aot-guard"
      - name: Run the smoke checks against the native binary
        run: '"${{ runner.temp }}/web-aot-guard/Assimalign.Cohesion.Web.AotGuard" --smoke'
