name: Web
on:
  push:
    paths:
      - 'resources/Web/**'
      - 'sdks/Assimalign.Cohesion.Sdk.Web/**'
      - 'build/TestSupport/**'
      - 'fixtures/ResourceGenerationCheck/**'
      - 'fixtures/Directory.Build.props'
      - '!resources/Web/**/*.slnx'
      - '!resources/Web/**/*.md'
      # The area's Hosting.ApplicationModel integration builds on ApplicationModel.Hosting, so a
      # change to the application model reruns the area.
      - 'libraries/ApplicationModel/**'
      - '.github/workflows/resource-web.yml'        # When Pipeline File Changes
      # Shared build infrastructure that every project in this workflow compiles with.
      - '.github/actions/build/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'resources/Directory.Build.props'
      - 'resources/Directory.Build.targets'
      - 'build/Build.props'
      - 'build/Build.targets'
      - 'build/Targets/**'
      - 'build/Tasks/**'
  workflow_dispatch:
    inputs:
      all-os:
        description: Also run the Windows and macOS legs, which otherwise run only on main.
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch (or pull request) supersedes this run, so the older run is
# cancelled instead of holding runner slots: the organization's plan runs at most 20 jobs at once,
# 5 of them macOS. Every main commit keeps its own run, because the run id makes its group unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "${{ github.workflow }} [${{ matrix.os }}]"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Every leg reports its own result. With fail-fast, one failing project cancelled the rest
      # of the matrix and left a branch with no signal for the other Web libraries (#1093).
      fail-fast: false
      matrix:
        # Windows and macOS legs run on main, or on a manual run with all-os set; other pushes run
        # Linux only, because the organization's plan runs at most 5 macOS jobs at once.
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || inputs.all-os) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        # Every buildable Web project is listed so the area's dependency-rule guard
        # (build/Targets/Build.Rules.targets, COHRES001/COHRES002) executes in CI for
        # each of them - most importantly Web.Hosting.
        # One leg per OS builds and tests the whole area: the inner list is a single matrix value
        # that .github/actions/build receives whole. The release inventory guard reads this list.
        projects: [[
            'Assimalign.Cohesion.Web',
            'Assimalign.Cohesion.Web.Antiforgery',
            'Assimalign.Cohesion.Web.Api',
            'Assimalign.Cohesion.Web.Authentication',
            'Assimalign.Cohesion.Web.Authentication.Bearer',
            'Assimalign.Cohesion.Web.Authentication.Certificate',
            'Assimalign.Cohesion.Web.Authentication.Cookie',
            'Assimalign.Cohesion.Web.Authorization',
            'Assimalign.Cohesion.Web.Caching',
            'Assimalign.Cohesion.Web.Compression',
            'Assimalign.Cohesion.Web.CookiePolicy',
            'Assimalign.Cohesion.Web.Cors',
            'Assimalign.Cohesion.Web.Diagnostics',
            'Assimalign.Cohesion.Web.ErrorHandling',
            'Assimalign.Cohesion.Web.Forms',
            'Assimalign.Cohesion.Web.ForwardedHeaders',
            'Assimalign.Cohesion.Web.Health',
            'Assimalign.Cohesion.Web.HostFiltering',
            'Assimalign.Cohesion.Web.Hosting',
            'Assimalign.Cohesion.Web.Hosting.ApplicationModel',
            'Assimalign.Cohesion.Web.HttpsPolicy',
            'Assimalign.Cohesion.Web.OpenApi',
            'Assimalign.Cohesion.Web.ProblemDetails',
            'Assimalign.Cohesion.Web.Query',
            'Assimalign.Cohesion.Web.RateLimiting',
            'Assimalign.Cohesion.Web.RequestTimeouts',
            'Assimalign.Cohesion.Web.Rewrite',
            'Assimalign.Cohesion.Web.Routing',
            'Assimalign.Cohesion.Web.SecurityHeaders',
            'Assimalign.Cohesion.Web.Serialization',
            # The shared action runs Web.Server/tests/Assimalign.Cohesion.Web.Server.Tests.csproj.
            'Assimalign.Cohesion.Web.Server',
            'Assimalign.Cohesion.Web.Sessions',
            'Assimalign.Cohesion.Web.StaticFiles',
            'Assimalign.Cohesion.Web.Testing',
            'Assimalign.Cohesion.Web.Validation',
            'Assimalign.Cohesion.Web.WebSockets'
        ]]
    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - uses: ./.github/actions/build
        name: Build and test
        with:
          area: 'resources'
          category: 'Web'
          projects: ${{ toJSON(matrix.projects) }}

  # NativeAOT guard (#1052): a representative Web application — routing (groups, branching, the
  # static-file fallback), URL rewrite and redirect rules (#782),
  # source-generated typed binding and JSON, error handling, Cookie + JWT
  # Bearer, authorization, antiforgery, cookie policy, security headers, static files, compression,
  # CORS, rate limiting, request timeouts, handler return values, request validation, file uploads and
  # the OpenAPI document — published with PublishAot. The guard promotes the trim/AOT analyzer
  # diagnostics and ILC's per-assembly summaries (IL2104/IL3053) to errors, so a trim or AOT warning in
  # any Web library it reaches fails the publish; the smoke run then exercises every feature over real
  # HTTP and fails the job on the first failed check.
  # WebSockets (#765): a permessage-deflate echo behind the UseWebSockets origin policy.
  aot-guard:
    name: "Web NativeAOT guard [ubuntu-latest]"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build build/Tasks -c Release
      - name: Check build-generated resources with the CLI
        run: dotnet run --project fixtures/ResourceGenerationCheck/Assimalign.Cohesion.ResourceGenerationCheck.csproj -c Release -p:ContinuousIntegrationBuild=true
      - name: Check build-generated resources with NativeAOT
        run: |
          dotnet publish fixtures/ResourceGenerationCheck/Assimalign.Cohesion.ResourceGenerationCheck.csproj -c Release -r linux-x64 -p:PublishAot=true -o "${{ runner.temp }}/resource-generation-check"
          "${{ runner.temp }}/resource-generation-check/Assimalign.Cohesion.ResourceGenerationCheck"
      - name: Publish without EventSource support for the binary-size baseline
        run: dotnet publish resources/Web/Assimalign.Cohesion.Web.Hosting/samples/Assimalign.Cohesion.Web.AotGuard/Assimalign.Cohesion.Web.AotGuard.csproj -c Release -r linux-x64 -p:EventSourceSupport=false -o "${{ runner.temp }}/web-aot-guard-no-events"
      - name: Publish the guard with NativeAOT (trim/AOT warnings are errors)
        run: dotnet publish resources/Web/Assimalign.Cohesion.Web.Hosting/samples/Assimalign.Cohesion.Web.AotGuard/Assimalign.Cohesion.Web.AotGuard.csproj -c Release -r linux-x64 -p:EventSourceSupport=true -o "${{ runner.temp }}/web-aot-guard"
      - name: Record the linux-x64 EventSource binary-size delta
        shell: bash
        run: |
          without_events=$(stat -c %s "${{ runner.temp }}/web-aot-guard-no-events/Assimalign.Cohesion.Web.AotGuard")
          with_events=$(stat -c %s "${{ runner.temp }}/web-aot-guard/Assimalign.Cohesion.Web.AotGuard")
          delta=$((with_events - without_events))
          {
            echo '### Web NativeAOT EventSourceSupport size (linux-x64)'
            echo '| EventSourceSupport | Native executable bytes |'
            echo '| --- | ---: |'
            echo "| false | $without_events |"
            echo "| true | $with_events |"
            echo "| delta | $delta |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "EventSourceSupport delta: $delta bytes ($without_events without, $with_events with)."
      - name: Run the smoke checks against the native binary
        run: '"${{ runner.temp }}/web-aot-guard/Assimalign.Cohesion.Web.AotGuard" --smoke'
