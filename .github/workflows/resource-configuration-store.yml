name: Configuration Store
on:
  push:
    paths:
      # The area glob covers ConfigurationStore.ApplicationModel.Orchestration. Its tests run an application set
      # through a real ApplicationModel.Gateway (StoreGateway : ApplicationGateway), so a change to
      # the provider seams, the gateway that resolves through them, or Core reruns them.
      - 'resources/ConfigurationStore/**'
      - '!resources/ConfigurationStore/**/*.slnx'
      - '!resources/ConfigurationStore/**/*.md'
      - 'libraries/ApplicationModel/**'
      - 'libraries/Core/**'
      - '.github/workflows/resource-configuration-store.yml'        # When Pipeline File Changes

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects: [
            'Assimalign.Cohesion.ConfigurationStore',
            'Assimalign.Cohesion.ConfigurationStore.ApplicationModel',
            'Assimalign.Cohesion.ConfigurationStore.ApplicationModel.Orchestration',
            'Assimalign.Cohesion.ConfigurationStore.Client',
            'Assimalign.Cohesion.ConfigurationStore.Hosting'
        ]
    steps:
      - uses: actions/checkout@v7
        name: "Checkout: ${{ matrix.projects }}"

      - uses: ./.github/actions/build
        name: "Running Build & Tests: ${{ matrix.projects }}"
        with:
          area: 'resources'
          category: 'ConfigurationStore'
          project: ${{ matrix.projects }}
