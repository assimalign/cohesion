name: Rezolvr
on:
  push:
    paths:
      - 'resources/Rezolvr/**'
      - '.github/workflows/resource-rezolvr.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects: [
            'Assimalign.Cohesion.Rezolvr',
            'Assimalign.Cohesion.Rezolvr.ApplicationModel',
            'Assimalign.Cohesion.Rezolvr.Hosting'
        ]
    steps:
      - uses: actions/checkout@v4
        name: "Checkout: ${{ matrix.projects }}"

      - uses: ./.github/actions/build
        name: "Running Build & Tests: ${{ matrix.projects }}"
        with:
          area: 'resources'
          category: 'Rezolvr'
          project: ${{ matrix.projects }}
