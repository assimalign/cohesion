name: Database
on:
  push:
    paths:
      # Covers Database.Testing/fixtures/Assimalign.Cohesion.Database.SampleHost, the area's
      # acceptance fixture, and the engine/wire streaming fixtures under Blob and Blob.Client.
      # Fixtures sit inside the projects whose tests drive them.
      # Includes the five model Protocol src/tests/shared trees and the client-only AOT canary.
      - 'resources/Database/**'
      - '!resources/Database/**/*.slnx'
      - '!resources/Database/**/*.md'
      # The E2E job packs the SDK chain the SampleHost builds on (base and Database SDKs) through
      # Install-Local.ps1 and the packaging module beside it, and derives the SampleHost's SDK pins
      # from the root global.json (listed below); a change to any of them must re-run it.
      - 'sdks/Assimalign.Cohesion.Sdk/**'
      - 'sdks/Assimalign.Cohesion.Sdk.Database/**'
      - 'scripts/**'
      # The framework-closure job reads App.Database's member list against the project graph.
      - 'libraries/App/Assimalign.Cohesion.App.Runtime/tests/**'
      - '.github/workflows/resource-database.yml'        # When Pipeline File Changes
      # Shared build infrastructure that every project in this workflow compiles with.
      - '.github/actions/build/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'resources/Directory.Build.props'
      - 'resources/Directory.Build.targets'
      - 'build/Build.props'
      - 'build/Build.targets'
      - 'build/Targets/**'
      - 'build/Tasks/**'
  workflow_dispatch:
    inputs:
      all-os:
        description: Also run the Windows and macOS legs, which otherwise run only on main.
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch (or pull request) supersedes this run, so the older run is
# cancelled instead of holding runner slots: the organization's plan runs at most 20 jobs at once,
# 5 of them macOS. Every main commit keeps its own run, because the run id makes its group unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "${{ github.workflow }} [${{ matrix.os }}]"
    runs-on: ${{ matrix.os }}
    # Latest three successful consolidated main runs (39656175267, 39625288435, 39285511469):
    # slowest build 24m 1s; twice that, rounded up to 15 minutes, is 60 (#1470).
    timeout-minutes: 60
    strategy:
      # Every leg reports its own result. With fail-fast, one failing leg cancels the others (#1093).
      fail-fast: false
      matrix:
        # Windows and macOS legs run on main, or on a manual run with all-os set; other pushes run
        # Linux only, because the organization's plan runs at most 5 macOS jobs at once.
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || inputs.all-os) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        # Every delivered Database project is listed so the area's dependency-rule guard
        # (build/Targets/Build.Rules.targets, COHRES001/COHRES002) executes in CI for
        # each of them - most importantly Database.Hosting, which nothing else pulls in
        # transitively. The source-less Cache model scaffolds and Memory shell are
        # excluded until they ship. Catalog, Storage and model Security components
        # now belong to the engine projects; model Protocol projects remain separate.
        # One leg per OS builds and tests the whole area: the inner list is a single matrix value
        # that .github/actions/build receives whole. The release inventory guard reads this list.
        projects: [[
            'Assimalign.Cohesion.Database',
            'Assimalign.Cohesion.Database.Blob',
            'Assimalign.Cohesion.Database.Blob.Client',
            'Assimalign.Cohesion.Database.Blob.Protocol',
            'Assimalign.Cohesion.Database.Client',
            'Assimalign.Cohesion.Database.Documents',
            'Assimalign.Cohesion.Database.Documents.Client',
            'Assimalign.Cohesion.Database.Documents.Language',
            'Assimalign.Cohesion.Database.Documents.Protocol',
            'Assimalign.Cohesion.Database.Embedded',
            'Assimalign.Cohesion.Database.Execution',
            'Assimalign.Cohesion.Database.Graph',
            'Assimalign.Cohesion.Database.Graph.Client',
            'Assimalign.Cohesion.Database.Graph.Language',
            'Assimalign.Cohesion.Database.Graph.Protocol',
            'Assimalign.Cohesion.Database.Hosting',
            'Assimalign.Cohesion.Database.Indexing',
            'Assimalign.Cohesion.Database.KeyValuePair',
            'Assimalign.Cohesion.Database.KeyValuePair.Client',
            'Assimalign.Cohesion.Database.KeyValuePair.Protocol',
            'Assimalign.Cohesion.Database.Language',
            'Assimalign.Cohesion.Database.Protocol',
            'Assimalign.Cohesion.Database.Security',
            'Assimalign.Cohesion.Database.Sql',
            'Assimalign.Cohesion.Database.Sql.Client',
            'Assimalign.Cohesion.Database.Sql.Language',
            'Assimalign.Cohesion.Database.Sql.Protocol',
            'Assimalign.Cohesion.Database.Sql.Schema',
            'Assimalign.Cohesion.Database.Storage',
            'Assimalign.Cohesion.Database.Tcp',
            'Assimalign.Cohesion.Database.Testing',
            'Assimalign.Cohesion.Database.Transactions',
            'Assimalign.Cohesion.Database.Types'
        ]]
    steps:
      - uses: actions/checkout@v7
        name: Checkout

      # Database.Testing evaluates the real Sdk.Database SampleHost project, so it builds in the
      # database-testing job against the packages prepared below. It stays in the list above
      # because the release inventory guard reads only that list, and a single matrix value
      # cannot be excluded entry by entry.
      - name: Select the source-only projects
        id: select
        shell: pwsh
        env:
          COHESION_PROJECTS: ${{ toJSON(matrix.projects) }}
        run: |
          $projects = @($env:COHESION_PROJECTS | ConvertFrom-Json | Where-Object { $_ -ne 'Assimalign.Cohesion.Database.Testing' })
          "projects=$(ConvertTo-Json -InputObject $projects -Compress)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: ./.github/actions/build
        name: Build and test
        with:
          area: 'resources'
          category: 'Database'
          projects: ${{ steps.select.outputs.projects }}

  # The Database NativeAOT harnesses, published for linux-x64 and run (this machine leg
  # does not exist locally; win-arm64 is published by hand, see each csproj):
  # - the statement benchmark (DATABASE_ENGINE_EXTENSIBILITY_DESIGN.md section 10), the instrument
  #   each engine phase's performance gate is measured with, so it must keep compiling and running
  #   as the public API it drives changes; CI runs every case on a small table as a smoke, and the
  #   timings it prints are not a gate;
  # - the function-ABI guard (phase E2), which registers typed and hand-written functions, runs
  #   them in process and over the wire, and exits 1 when a check fails, so a trimmed or
  #   AOT-compiled build that loses a code path fails the job;
  # - the Documents client guard, which drives OQL and document commands through real servers
  #   over InMemory and TCP, checking typed failures and pooled session reuse.
  # - the shared TCP guard, which authenticates and exchanges Ping/Pong with every model.
  # All guard projects set PublishAot. Each publish step fails on any IL2xxx/IL3xxx warning in its
  # output, whatever the project promotes to an error (the guard also makes ILC's warnings errors).
  sql-benchmarks:
    name: "Database NativeAOT harnesses (linux-x64)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore build tasks
        shell: pwsh
        run: dotnet restore "./build/Tasks/Assimalign.Cohesion.Build.Tasks.csproj"

      - name: Build build tasks
        shell: pwsh
        run: dotnet build "./build/Tasks/Assimalign.Cohesion.Build.Tasks.csproj" --configuration Release --no-restore

      - name: Publish and run the function-ABI NativeAOT guard
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "sql-aot-sample"
          $log = dotnet publish "./resources/Database/Assimalign.Cohesion.Database.Sql/samples/Assimalign.Cohesion.Database.Sql.AotSample/Assimalign.Cohesion.Database.Sql.AotSample.csproj" `
              --configuration Release `
              --runtime linux-x64 `
              --output $output `
              --nologo 2>&1
          $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "NativeAOT publish of Database.Sql.AotSample failed with exit code $LASTEXITCODE."
          }
          if ($log -match "warning IL[23][0-9]{3}") {
            throw "NativeAOT publish of Database.Sql.AotSample reported IL2xxx/IL3xxx warnings."
          }

          & (Join-Path $output "Assimalign.Cohesion.Database.Sql.AotSample")
          if ($LASTEXITCODE -ne 0) {
            throw "Database.Sql.AotSample reported a failed check (exit code $LASTEXITCODE)."
          }

      - name: Publish and run the engine-free client NativeAOT canary
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $output = Join-Path $env:RUNNER_TEMP "client-aot-sample"
          # WriteClientCanaryClosure checks compiler references before trimming and fails on engines.
          $log = dotnet publish "./resources/Database/Assimalign.Cohesion.Database.Client/samples/Assimalign.Cohesion.Database.Client.AotSample/Assimalign.Cohesion.Database.Client.AotSample.csproj" `
              --configuration Release `
              --runtime linux-x64 `
              --output $output `
              --nologo 2>&1
          $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "NativeAOT publish of Database.Client.AotSample failed with exit code $LASTEXITCODE."
          }
          if ($log -match "warning IL[23][0-9]{3}") {
            throw "NativeAOT publish of Database.Client.AotSample reported IL2xxx/IL3xxx warnings."
          }

          & (Join-Path $output "Assimalign.Cohesion.Database.Client.AotSample")
          if ($LASTEXITCODE -ne 0) {
            throw "Database.Client.AotSample reported a failed check (exit code $LASTEXITCODE)."
          }

      - name: Publish and run the Documents client NativeAOT guard
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "documents-aot-sample"
          $log = dotnet publish "./resources/Database/Assimalign.Cohesion.Database.Documents.Client/samples/Assimalign.Cohesion.Database.Documents.AotSample/Assimalign.Cohesion.Database.Documents.AotSample.csproj" `
              --configuration Release `
              --runtime linux-x64 `
              --output $output `
              --nologo 2>&1
          $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "NativeAOT publish of Database.Documents.AotSample failed with exit code $LASTEXITCODE."
          }
          if ($log -match "warning IL[23][0-9]{3}") {
            throw "NativeAOT publish of Database.Documents.AotSample reported IL2xxx/IL3xxx warnings."
          }

          & (Join-Path $output "Assimalign.Cohesion.Database.Documents.AotSample")
          if ($LASTEXITCODE -ne 0) {
            throw "Database.Documents.AotSample reported a failed check (exit code $LASTEXITCODE)."
          }

      - name: Publish and run the shared TCP NativeAOT guard
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: '1'
        run: |
          $output = Join-Path $env:RUNNER_TEMP "tcp-aot-sample"
          $log = dotnet publish "./resources/Database/Assimalign.Cohesion.Database.Tcp/samples/Assimalign.Cohesion.Database.Tcp.AotSample/Assimalign.Cohesion.Database.Tcp.AotSample.csproj" `
              --configuration Release `
              --runtime linux-x64 `
              --output $output `
              --nologo 2>&1
          $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "NativeAOT publish of Database.Tcp.AotSample failed with exit code $LASTEXITCODE."
          }
          if ($log -match "warning (?:IL[23]|CS)[0-9]{3,4}") {
            throw "NativeAOT publish of Database.Tcp.AotSample reported compiler or trimming warnings."
          }

          $checks = & (Join-Path $output "Assimalign.Cohesion.Database.Tcp.AotSample")
          $checks | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "Database.Tcp.AotSample reported a failed check (exit code $LASTEXITCODE)."
          }
          if ($checks -notcontains "Database.Tcp NativeAOT: 5/5 model servers passed.") {
            throw "Database.Tcp.AotSample did not complete all five model checks."
          }

      - name: Publish and smoke-run the NativeAOT statement benchmark
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "sql-benchmarks"
          $log = dotnet publish "./resources/Database/Assimalign.Cohesion.Database.Sql/samples/Assimalign.Cohesion.Database.Sql.Benchmarks/Assimalign.Cohesion.Database.Sql.Benchmarks.csproj" `
              --configuration Release `
              --runtime linux-x64 `
              --output $output `
              --nologo 2>&1
          $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "NativeAOT publish of Database.Sql.Benchmarks failed with exit code $LASTEXITCODE."
          }
          if ($log -match "warning IL[23][0-9]{3}") {
            throw "NativeAOT publish of Database.Sql.Benchmarks reported IL2xxx/IL3xxx warnings."
          }

          & (Join-Path $output "Assimalign.Cohesion.Database.Sql.Benchmarks") --rows 2000 --iterations 1 --label ci-smoke
          if ($LASTEXITCODE -ne 0) {
            throw "Database.Sql.Benchmarks failed with exit code $LASTEXITCODE."
          }

  database-testing-pack:
    name: "Prepare Database SDK E2E packages"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # One runtime pack per E2E leg's RID: only the Linux leg runs off main without all-os.
      - name: Pack local SDK and framework closure
        shell: pwsh
        env:
          COHESION_RIDS: ${{ (github.ref == 'refs/heads/main' || inputs.all-os) && 'linux-x64,win-x64,osx-arm64' || 'linux-x64' }}
        run: |
          ./scripts/Install-Local.ps1 `
              -Configuration Release `
              -Rids ($env:COHESION_RIDS -split ',') `
              -SkipLibraries

      - name: Upload local SDK and framework closure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-sdk-e2e-packages
          path: |
            _out/packages/*.nupkg
            resources/Database/global.json
          if-no-files-found: error
          retention-days: 1

  database-testing:
    name: "Database.Testing E2E [${{ matrix.os }}]"
    needs: database-testing-pack
    runs-on: ${{ matrix.os }}
    # Same healthy runs: slowest E2E 3m 15s; the #1470 minimum for this job is 45 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Same OS selection as the build job; the pack job packs a runtime pack for each leg here.
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || inputs.all-os) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Download local SDK and framework closure
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: database-sdk-e2e-packages
          path: .

      - uses: ./.github/actions/build
        name: "Running Build & E2E: Assimalign.Cohesion.Database.Testing"
        with:
          area: 'resources'
          category: 'Database'
          project: 'Assimalign.Cohesion.Database.Testing'

  framework-closure:
    # App.Database's hand-curated member list must cover the shipped project closure of every
    # Database library. SDK Smoke runs the same static test, but only for the Database paths it
    # watches; this job runs it for a change to any Database project. It reads csprojs and the
    # Runtime producers' Directory.Build.props and needs no packs, but its test project builds
    # through the shared targets, whose code generation loads the build tasks.
    name: "App.Database framework closure"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore build tasks
        shell: pwsh
        run: dotnet restore "./build/Tasks/Assimalign.Cohesion.Build.Tasks.csproj"

      - name: Build build tasks
        shell: pwsh
        run: dotnet build "./build/Tasks/Assimalign.Cohesion.Build.Tasks.csproj" --configuration Release --no-restore

      - name: Run framework manifest tests
        shell: pwsh
        run: |
          dotnet test `
              ./libraries/App/Assimalign.Cohesion.App.Runtime/tests/Assimalign.Cohesion.App.Runtime.Tests.csproj `
              --configuration Release `
              --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "Framework manifest tests failed with exit code $LASTEXITCODE."
          }
