name: Database
on:
  push:
    paths:
      # Covers Database.Testing/fixtures/Assimalign.Cohesion.Database.SampleHost, the area's
      # acceptance fixture, and the engine/wire streaming fixtures under Blob and Blob.Client.
      # Fixtures sit inside the projects whose tests drive them.
      - 'resources/Database/**'
      - '.github/actions/build/**'
      - '.github/workflows/resource-database.yml'        # When Pipeline File Changes

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Every delivered Database project is listed so the area's dependency-rule guard
        # (build/Targets/Build.Rules.targets, COHRES001/COHRES002) executes in CI for
        # each of them - most importantly Database.Hosting, which nothing else pulls in
        # transitively. The as-yet source-less model scaffolds (Cache, plus
        # Documents.Client/.Replication/.Security, Graph.Client/.Replication/.Security,
        # Blob.Replication/.Security and
        # KeyValuePair.Replication/.Security) and the post-MVP contract
        # shells (Replication, Sql.Replication, Sql.Security, Memory) are
        # excluded until they ship.
        projects: [
            'Assimalign.Cohesion.Database',
            'Assimalign.Cohesion.Database.ApplicationModel',
            'Assimalign.Cohesion.Database.Blob',
            'Assimalign.Cohesion.Database.Blob.Catalog',
            'Assimalign.Cohesion.Database.Blob.Client',
            'Assimalign.Cohesion.Database.Blob.Storage',
            'Assimalign.Cohesion.Database.Client',
            'Assimalign.Cohesion.Database.Documents',
            'Assimalign.Cohesion.Database.Documents.Catalog',
            'Assimalign.Cohesion.Database.Documents.Language',
            'Assimalign.Cohesion.Database.Documents.Storage',
            'Assimalign.Cohesion.Database.Embedded',
            'Assimalign.Cohesion.Database.Execution',
            'Assimalign.Cohesion.Database.Governance',
            'Assimalign.Cohesion.Database.Graph',
            'Assimalign.Cohesion.Database.Graph.Catalog',
            'Assimalign.Cohesion.Database.Graph.Language',
            'Assimalign.Cohesion.Database.Graph.Storage',
            'Assimalign.Cohesion.Database.Hosting',
            'Assimalign.Cohesion.Database.Indexing',
            'Assimalign.Cohesion.Database.KeyValuePair',
            'Assimalign.Cohesion.Database.KeyValuePair.Catalog',
            'Assimalign.Cohesion.Database.KeyValuePair.Client',
            'Assimalign.Cohesion.Database.KeyValuePair.Storage',
            'Assimalign.Cohesion.Database.Language',
            'Assimalign.Cohesion.Database.Protocol',
            'Assimalign.Cohesion.Database.Security',
            'Assimalign.Cohesion.Database.Sql',
            'Assimalign.Cohesion.Database.Sql.Catalog',
            'Assimalign.Cohesion.Database.Sql.Client',
            'Assimalign.Cohesion.Database.Sql.Language',
            'Assimalign.Cohesion.Database.Sql.Schema',
            'Assimalign.Cohesion.Database.Sql.Storage',
            'Assimalign.Cohesion.Database.Sql.Tcp',
            'Assimalign.Cohesion.Database.Storage',
            'Assimalign.Cohesion.Database.Testing',
            'Assimalign.Cohesion.Database.Transactions',
            'Assimalign.Cohesion.Database.Types'
        ]
        # Database.Testing evaluates the real Sdk.Database SampleHost project. Its
        # package-backed SDK/framework closure is prepared once below and reused on
        # all three runners, so exclude it from the source-only build leg.
        exclude:
          - os: ubuntu-latest
            projects: 'Assimalign.Cohesion.Database.Testing'
          - os: windows-latest
            projects: 'Assimalign.Cohesion.Database.Testing'
          - os: macos-latest
            projects: 'Assimalign.Cohesion.Database.Testing'
    steps:
      - uses: actions/checkout@v4
        name: "Checkout: ${{ matrix.projects }}"

      - uses: ./.github/actions/build
        name: "Running Build & Tests: ${{ matrix.projects }}"
        with:
          area: 'resources'
          category: 'Database'
          project: ${{ matrix.projects }}

  database-testing-pack:
    name: "Prepare Database SDK E2E packages"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Pack local SDK and framework closure
        shell: pwsh
        run: |
          ./installer/scripts/Install-Local.ps1 `
              -Configuration Release `
              -Rids linux-x64,win-x64,osx-arm64 `
              -SkipLibraries

      - name: Upload local SDK and framework closure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-sdk-e2e-packages
          path: |
            _out/packages/*.nupkg
            resources/Database/global.json
          if-no-files-found: error
          retention-days: 1

  database-testing:
    name: "Database.Testing E2E [${{ matrix.os }}]"
    needs: database-testing-pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Download local SDK and framework closure
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: database-sdk-e2e-packages
          path: .

      - uses: ./.github/actions/build
        name: "Running Build & E2E: Assimalign.Cohesion.Database.Testing"
        with:
          area: 'resources'
          category: 'Database'
          project: 'Assimalign.Cohesion.Database.Testing'
