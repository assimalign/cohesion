name: Scheduler
on:
  push:
    paths:
      - 'resources/Scheduler/**'
      - '!resources/Scheduler/**/*.slnx'
      - '!resources/Scheduler/**/*.md'
      - '.github/workflows/resource-scheduler.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects: [
            'Assimalign.Cohesion.Scheduler',
            'Assimalign.Cohesion.Scheduler.ApplicationModel',
            'Assimalign.Cohesion.Scheduler.Cron',
            'Assimalign.Cohesion.Scheduler.Hosting',
            'Assimalign.Cohesion.Scheduler.Timer'
        ]
    steps:
      - uses: actions/checkout@v7
        name: "Checkout: ${{ matrix.projects }}"

      - uses: ./.github/actions/build
        name: "Running Build & Tests: ${{ matrix.projects }}"
        with:
          area: 'resources'
          category: 'Scheduler'
          project: ${{ matrix.projects }}
