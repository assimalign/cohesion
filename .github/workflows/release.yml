# Official Cohesion release pipeline.
#
# A published GitHub Release is the only package-publication trigger. The release tag must match
# the complete centrally declared CohesionVersion, including any prerelease suffix. The validated
# set is staged automatically in GitHub Packages; promotion of that same artifact to nuget.org is
# routed through the `nuget-org` environment.
#
# SETUP REQUIRED before the first tagged release:
#   * Create the `nuget-org` repository environment and give it required reviewers. GitHub
#     auto-creates a referenced environment with NO protection rules, so until reviewers are
#     configured the nuget.org promotion does not actually pause for anyone.
#   * Give the `NUGET_USER` organization VARIABLE visibility that includes assimalign/cohesion,
#     and register the trusted-publishing policy for this repository on nuget.org so the OIDC
#     exchange in publish-nuget succeeds.
#
# Everything the release ships and everything it validates comes from one place:
# installer/scripts/modules/CohesionPackaging.psm1. The prepare job turns that inventory into the
# validation matrix and Pack-Release.ps1 packs from it, so the set CI proves and the set that
# reaches nuget.org cannot drift apart.
#
# Every `uses:` is pinned to a commit SHA with a TRAILING version comment. A git tag is mutable -
# `@v7` can be repointed at new code that then runs with this workflow's packages:write and
# nuget.org OIDC. The comment is trailing, not on its own line, because that is the form Dependabot
# rewrites when it bumps a SHA; .github/dependabot.yml keeps both this file and the composite
# action it calls current.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Resolves the release version and the validation matrix before anything expensive runs.
  #
  # Viu resolves its version inside the pack job; with ~130 validation legs ahead of the pack, a
  # tag/version mismatch found there would waste the whole matrix. Cohesion can afford to check
  # first because Get-CohesionVersion.ps1 reads the props files as XML - no SDK, no restore. The
  # single derivation is preserved: pack-packages consumes this job's output rather than
  # re-deriving the version.
  prepare:
    name: resolve release version and matrix
    if: github.event_name == 'release' && github.event.release.draft == false
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      # The tag is resolved to a commit ONCE, here, and every downstream job checks out that
      # commit rather than the tag. A git tag is movable: re-pointing it between the validation
      # matrix and the pack would publish something no job in this run ever built or tested, which
      # is precisely the guarantee the pipeline exists to make. Viu re-resolves the tag in each
      # job and carries that gap.
      - name: Resolve release commit
        id: commit
        shell: pwsh
        run: |
          & git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) {
            throw "Fetching origin/main failed with exit code $LASTEXITCODE."
          }

          $releaseCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Resolving the checked-out commit failed.'
          }

          & git merge-base --is-ancestor $releaseCommit origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release builds must use a commit reachable from main.'
          }

          "commit=$releaseCommit" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release commit: $releaseCommit"

      - name: Resolve package version
        id: version
        shell: pwsh
        env:
          COHESION_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Shared with installer/scripts/Install-Local.ps1 and the framework workflow, so the
          # version this pipeline publishes cannot drift from what the local packer produces.
          $canonicalVersion = (& ./installer/scripts/Get-CohesionVersion.ps1)
          if (-not $canonicalVersion) {
            throw 'Get-CohesionVersion.ps1 produced no output.'
          }

          $canonicalVersion = $canonicalVersion.Trim()
          if ($canonicalVersion -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            throw "Canonical Cohesion version '$canonicalVersion' is not supported SemVer."
          }

          $tagMatch = [System.Text.RegularExpressions.Regex]::Match(
            $env:COHESION_RELEASE_TAG,
            '^v(?<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$',
            [System.Text.RegularExpressions.RegexOptions]::CultureInvariant)
          if (-not $tagMatch.Success) {
            throw 'GitHub releases must use a vMAJOR.MINOR.PATCH[-PRERELEASE] tag.'
          }

          $releaseVersion = $tagMatch.Groups['version'].Value
          if ($releaseVersion -ne $canonicalVersion) {
            throw "Release tag version $releaseVersion does not match canonical Cohesion version $canonicalVersion."
          }

          "version=$releaseVersion" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release package version: $releaseVersion"

      - name: Resolve validation matrix
        id: matrix
        shell: pwsh
        run: |
          # Get-ReleaseMatrix.ps1 runs the inventory drift guard before emitting anything, so a
          # release that would ship something CI never validated - or silently omit something CI
          # does validate - fails here, before a single project is built.
          $matrix = (& ./installer/scripts/Get-ReleaseMatrix.ps1)
          if (-not $matrix) {
            throw 'Get-ReleaseMatrix.ps1 produced no matrix.'
          }

          # GITHUB_OUTPUT is line-oriented. If the script ever emitted more than the one compact
          # JSON line, PowerShell would join the array with spaces and write a silently corrupt
          # value that only fails much later, as an unreadable fromJSON error on the matrix.
          if (@($matrix).Count -ne 1 -or $matrix -match "`n") {
            throw 'Get-ReleaseMatrix.ps1 must emit exactly one line of JSON on stdout.'
          }

          "matrix=$matrix" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Validation legs: $((($matrix | ConvertFrom-Json).include).Count)"

  # One leg per shipping package, running the same canonical build-and-test recipe the per-area
  # workflows run on push. Linux only: the per-area workflows already cover the ubuntu/windows/macos
  # matrix continuously, so re-running three OSes here would triple a ~130-leg matrix to prove
  # something the branch already proved.
  validate-release:
    name: validate ${{ matrix.project }}
    needs: prepare
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # The commit prepare pinned, not the tag - see the note on prepare's "Resolve release
          # commit" step.
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Run canonical area build and tests
        uses: ./.github/actions/build
        with:
          area: ${{ matrix.area }}
          category: ${{ matrix.category }}
          project: ${{ matrix.project }}

  pack-packages:
    name: pack all NuGet packages
    needs: [prepare, validate-release]
    if: github.event_name == 'release' && github.event.release.draft == false
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ needs.prepare.outputs.version }}
      package-count: ${{ steps.package-count.outputs.count }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Same commit validate-release built. prepare already proved it is reachable from main.
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Exactly the SDK pinned in global.json, same as .github/actions/build, so the packages
          # this job publishes are built by the SDK the branch was validated with.
          global-json-file: global.json

      - name: Pack release
        shell: pwsh
        env:
          COHESION_PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./installer/scripts/Pack-Release.ps1 -Version $env:COHESION_PACKAGE_VERSION

      # The publish jobs assert the artifact they download still carries every package this job
      # produced. They cannot compute that themselves - they only download the artifact and never
      # check out the repository - so the producer publishes the number. Deriving it here is what
      # keeps it from drifting: Pack-Release.ps1 writes package-order.txt from the same
      # authoritative inventory it validates the pack against, so adding a package updates this
      # automatically.
      - name: Record package count
        id: package-count
        shell: pwsh
        run: |
          $packageOrderPath = '_out/release/packages/package-order.txt'
          $packageCount = @(Get-Content -LiteralPath $packageOrderPath).Count
          if ($packageCount -lt 1) {
            throw "Pack-Release.ps1 produced no packages in $packageOrderPath."
          }

          "count=$packageCount" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release package count: $packageCount"

      - name: Verify package checksums
        shell: bash
        working-directory: _out/release/packages
        run: sha256sum --check checksums.sha256

      - name: Upload package release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Assimalign.Cohesion.Packages
          path: _out/release/packages
          if-no-files-found: error
          retention-days: 14

  publish-github-packages:
    name: stage packages in GitHub Packages
    if: github.event_name == 'release'
    needs: pack-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      # Version-keyed: two different releases in flight must not serialize behind one another, and
      # a third must never cancel the second. cancel-in-progress is false, so same-version runs
      # queue rather than clobber.
      group: cohesion-github-packages-release-${{ needs.pack-packages.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Download validated packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Assimalign.Cohesion.Packages
          path: _release/packages

      - name: Verify package checksums
        shell: bash
        working-directory: _release/packages
        run: sha256sum --check checksums.sha256

      - name: Stage validated packages
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          COHESION_PACKAGE_VERSION: ${{ needs.pack-packages.outputs.version }}
          COHESION_PACKAGE_COUNT: ${{ needs.pack-packages.outputs.package-count }}
        run: |
          $packageDirectory = '_release/packages'
          $packageFiles = @(Get-Content -LiteralPath "$packageDirectory/package-order.txt")
          $expectedPackageCount = [int]$env:COHESION_PACKAGE_COUNT
          if ($packageFiles.Count -ne $expectedPackageCount) {
            throw "Expected $expectedPackageCount release packages, found $($packageFiles.Count)."
          }

          foreach ($packageFile in $packageFiles) {
            $packagePath = Join-Path $packageDirectory $packageFile
            if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
              throw "The release artifact is missing $packageFile."
            }

            # --skip-duplicate, not the delete-then-push of .github/scripts/Publish-Nupkg.ps1: a
            # release version is immutable. Re-running the pipeline for the same tag must be a
            # no-op on the feed, never a replacement.
            & dotnet nuget push $packagePath `
              --source 'https://nuget.pkg.github.com/assimalign/index.json' `
              --api-key $env:GITHUB_PACKAGES_TOKEN `
              --no-symbols `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "Publishing $packageFile to GitHub Packages failed with exit code $LASTEXITCODE."
            }
          }

          @"
          ## Staged release packages

          Staged all $($packageFiles.Count) validated Cohesion packages at version ``$($env:COHESION_PACKAGE_VERSION)``
          in the Assimalign GitHub Packages feed. Symbol packages remain in the validated artifact
          for nuget.org promotion.
          "@ |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  publish-nuget:
    name: promote packages to nuget.org
    # nuget.org promotion is limited to the public prerelease channels: preview and
    # release-candidate versions promote; alpha/beta releases stop at the GitHub Packages
    # staging feed. Stable (suffixless) versions are deliberately NOT matched yet - when the
    # stable channel opens, add a suffixless condition here alongside these two.
    if: >-
      github.event_name == 'release' &&
      (contains(needs.pack-packages.outputs.version, '-preview.') ||
       contains(needs.pack-packages.outputs.version, '-rc.'))
    needs: [pack-packages, publish-github-packages]
    runs-on: ubuntu-24.04
    environment:
      name: nuget-org
      url: https://www.nuget.org/profiles/Assimalign
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cohesion-nuget-org-release-${{ needs.pack-packages.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Download validated packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Assimalign.Cohesion.Packages
          path: _release/packages

      - name: Verify package checksums
        shell: bash
        working-directory: _release/packages
        run: sha256sum --check checksums.sha256

      # NUGET_USER is an ORGANIZATION VARIABLE, not a secret - it is the public nuget.org profile
      # name, and the OIDC exchange below is what actually proves identity. `vars`, not `secrets`:
      # the wrong context resolves to an empty string rather than failing, so the mistake would
      # surface as an opaque error from inside NuGet/login. Viu's release.yml reads
      # `secrets.NUGET_USER` and carries exactly that hazard.
      - name: Verify the nuget.org profile is available to this repository
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw 'The NUGET_USER organization variable is empty here. Set its visibility to include assimalign/cohesion (Organization settings -> Secrets and variables -> Actions -> Variables).'
          }

          Write-Host "Promoting as nuget.org profile: $env:NUGET_USER"

      - name: Exchange GitHub OIDC token for a temporary NuGet API key
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Promote validated packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          COHESION_PACKAGE_VERSION: ${{ needs.pack-packages.outputs.version }}
          COHESION_PACKAGE_COUNT: ${{ needs.pack-packages.outputs.package-count }}
        run: |
          $packageDirectory = '_release/packages'
          $packageFiles = @(Get-Content -LiteralPath "$packageDirectory/package-order.txt")
          $expectedPackageCount = [int]$env:COHESION_PACKAGE_COUNT
          if ($packageFiles.Count -ne $expectedPackageCount) {
            throw "Expected $expectedPackageCount release packages, found $($packageFiles.Count)."
          }

          foreach ($packageFile in $packageFiles) {
            $packagePath = Join-Path $packageDirectory $packageFile
            if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
              throw "The release artifact is missing $packageFile."
            }

            & dotnet nuget push $packagePath `
              --source 'https://api.nuget.org/v3/index.json' `
              --api-key $env:NUGET_API_KEY `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              throw "Publishing $packageFile to nuget.org failed with exit code $LASTEXITCODE."
            }
          }

          @"
          ## Promoted release packages

          Promoted all $($packageFiles.Count) Cohesion packages and their symbol packages at version
          ``$($env:COHESION_PACKAGE_VERSION)`` to
          [nuget.org](https://www.nuget.org/profiles/Assimalign).
          "@ |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
