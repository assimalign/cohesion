name: JsonSchema
on:
  push:
    paths:
      - 'libraries/JsonSchema/**'
      - '!libraries/JsonSchema/**/*.slnx'
      - '!libraries/JsonSchema/**/*.md'
      - '.github/workflows/library-json-schema.yml'                    # When Pipeline File Changes
      # Shared build infrastructure that every project in this workflow compiles with.
      - '.github/actions/build/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'libraries/Directory.Build.props'
      - 'libraries/Directory.Build.targets'
      - 'build/Build.props'
      - 'build/Build.targets'
      - 'build/Targets/**'
      - 'build/Tasks/**'
  workflow_dispatch:
    inputs:
      all-os:
        description: Also run the Windows and macOS legs, which otherwise run only on main.
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch (or pull request) supersedes this run, so the older run is
# cancelled instead of holding runner slots: the organization's plan runs at most 20 jobs at once,
# 5 of them macOS. Every main commit keeps its own run, because the run id makes its group unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "${{ github.workflow }} [${{ matrix.os }}]"
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '{}')[matrix.os] || matrix.os }}
    timeout-minutes: 30
    strategy:
      # Every leg reports its own result: with fail-fast, one failing leg cancels the rest of the
      # matrix and leaves the other projects without a signal (#1093).
      fail-fast: false
      matrix:
        # Windows and macOS legs run on main, or on a manual run with all-os set; other pushes run
        # Linux only, because the organization's plan runs at most 5 macOS jobs at once.
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || inputs.all-os) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        # One leg per OS builds and tests the whole area: the inner list is a single matrix value
        # that .github/actions/build receives whole. The release inventory guard reads this list.
        projects: [[
            'Assimalign.Cohesion.JsonSchema',
            'Assimalign.Cohesion.JsonSchema.Generation'
        ]]
    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - uses: ./.github/actions/build
        name: Build and test
        with:
          area: 'libraries'
          category: 'JsonSchema'
          projects: ${{ toJSON(matrix.projects) }}

  # The family's NativeAOT guard, published for linux-x64 and run. The sample loads schemas in
  # every dialect, follows $ref, $dynamicRef and remote references, asserts formats (the IDNA
  # tables included), registers a custom format and keyword, validates against meta-schemas, writes
  # each output format, and generates documents from a source-generated contract in the three
  # dialects Generation writes. It exits 1 when a check fails, so a trimmed or AOT-compiled build
  # that loses a code path fails the job, not only the build. The publish step also fails on any
  # IL2xxx/IL3xxx warning in its output, whatever the project promotes to an error.
  aot:
    name: "JsonSchema NativeAOT guard (linux-x64)"
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '{}')['ubuntu-latest'] || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore build tasks
        shell: pwsh
        run: dotnet restore "./build/Tasks/Assimalign.Cohesion.Build.Tasks.csproj"

      - name: Build build tasks
        shell: pwsh
        run: dotnet build "./build/Tasks/Assimalign.Cohesion.Build.Tasks.csproj" --configuration Release --no-restore

      - name: Publish and run the JsonSchema NativeAOT guard
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "json-schema-aot-sample"
          $log = dotnet publish "./libraries/JsonSchema/Assimalign.Cohesion.JsonSchema/samples/Assimalign.Cohesion.JsonSchema.AotSample/Assimalign.Cohesion.JsonSchema.AotSample.csproj" `
              --configuration Release `
              --runtime linux-x64 `
              --output $output `
              --nologo 2>&1
          $log | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "NativeAOT publish of JsonSchema.AotSample failed with exit code $LASTEXITCODE."
          }
          if ($log -match "warning IL[23][0-9]{3}") {
            throw "NativeAOT publish of JsonSchema.AotSample reported IL2xxx/IL3xxx warnings."
          }

          $checks = & (Join-Path $output "Assimalign.Cohesion.JsonSchema.AotSample")
          $checks | Write-Host
          if ($LASTEXITCODE -ne 0) {
            throw "JsonSchema.AotSample reported a failed check (exit code $LASTEXITCODE)."
          }
          if ($checks -notcontains "JsonSchema AOT sample: all checks passed.") {
            throw "JsonSchema.AotSample did not complete its checks."
          }
