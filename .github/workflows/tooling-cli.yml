name: Cohesion CLI
on:
  push:
    paths:
      - 'tooling/Cli/**'
      - 'build/**'
      - '.github/workflows/tooling-cli.yml'
      # Shared build infrastructure that every project in this workflow compiles with.
      - '.github/actions/build/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'tooling/Directory.Build.props'
      - 'tooling/Directory.Build.targets'
  pull_request:
    paths:
      - 'tooling/Cli/**'
      - 'build/**'
      - '.github/workflows/tooling-cli.yml'
      # Shared build infrastructure that every project in this workflow compiles with.
      - '.github/actions/build/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'tooling/Directory.Build.props'
      - 'tooling/Directory.Build.targets'
  workflow_dispatch:
    inputs:
      all-os:
        description: Also run the Windows and macOS legs, which otherwise run only on main.
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch (or pull request) supersedes this run, so the older run is
# cancelled instead of holding runner slots: the organization's plan runs at most 20 jobs at once,
# 5 of them macOS. Every main commit keeps its own run, because the run id makes its group unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "${{ github.workflow }} [${{ matrix.os }}]"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS legs run on main, or on a manual run with all-os set; other pushes run
        # Linux only, because the organization's plan runs at most 5 macOS jobs at once.
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || inputs.all-os) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        # One leg per OS builds and tests the whole area: the inner list is a single matrix value
        # that .github/actions/build receives whole. The release inventory guard reads this list.
        projects: [[ 'Assimalign.Cohesion.Cli' ]]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout
      - uses: ./.github/actions/build
        name: Build and test
        with:
          area: 'tooling'
          category: 'Cli'
          projects: ${{ toJSON(matrix.projects) }}
