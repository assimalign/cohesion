name: SDK Smoke

on:
  push:
    paths:
      - ".github/workflows/sdk-smoke.yml"
      - ".github/scripts/Invoke-SdkConsumerSmoke.ps1"
      - "analyzers/**"
      - "build/**"
      - "frameworks/**"
      - "installer/scripts/**"
      - "libraries/ApplicationModel/**"
      - "libraries/Connections/**"
      - "libraries/Core/**"
      - "libraries/Hosting/**"
      - "libraries/Http/**"
      - "libraries/ObjectMapping/**"
      - "libraries/Security/Assimalign.Cohesion.Security.DataProtection/**"
      - "resources/ConfigurationStore/Assimalign.Cohesion.ConfigurationStore.ApplicationModel/**"
      - "resources/ConfigurationStore/Assimalign.Cohesion.ConfigurationStore.Client/**"
      - "resources/ConfigurationStore/Assimalign.Cohesion.ConfigurationStore.Hosting/**"
      - "resources/Database/Assimalign.Cohesion.Database.ApplicationModel/**"
      - "resources/Database/Assimalign.Cohesion.Database.Client/**"
      - "resources/Database/Assimalign.Cohesion.Database.Execution/**"
      - "resources/Database/Assimalign.Cohesion.Database.Governance/**"
      - "resources/Database/Assimalign.Cohesion.Database.Hosting/**"
      - "resources/Database/Assimalign.Cohesion.Database.Indexing/**"
      - "resources/Database/Assimalign.Cohesion.Database.Language/**"
      - "resources/Database/Assimalign.Cohesion.Database.Protocol/**"
      - "resources/Database/Assimalign.Cohesion.Database.Security/**"
      - "resources/Database/Assimalign.Cohesion.Database.Storage/**"
      - "resources/Database/Assimalign.Cohesion.Database.Transactions/**"
      - "resources/Database/Assimalign.Cohesion.Database.Types/**"
      - "resources/Database/Assimalign.Cohesion.Database/**"
      - "resources/IdentityHub/Assimalign.Cohesion.IdentityHub.ApplicationModel/**"
      - "resources/IdentityHub/Assimalign.Cohesion.IdentityHub.Client/**"
      - "resources/IdentityHub/Assimalign.Cohesion.IdentityHub.Hosting/**"
      - "resources/Rezolvr/Assimalign.Cohesion.Rezolvr.ApplicationModel/**"
      - "resources/Rezolvr/Assimalign.Cohesion.Rezolvr.Client/**"
      - "resources/Rezolvr/Assimalign.Cohesion.Rezolvr.Hosting/**"
      - "resources/SecretStore/Assimalign.Cohesion.SecretStore.ApplicationModel/**"
      - "resources/SecretStore/Assimalign.Cohesion.SecretStore.Client/**"
      - "resources/SecretStore/Assimalign.Cohesion.SecretStore.Hosting/**"
      - "resources/Web/Assimalign.Cohesion.Web.ApplicationModel/**"
      - "resources/Web/Assimalign.Cohesion.Web.Hosting/**"
      - "resources/Web/Assimalign.Cohesion.Web.Routing/**"
      - "resources/Web/Assimalign.Cohesion.Web/**"
      - "samples/SdkSmoke/**"
      - "sdks/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "global.json"
  pull_request:
    paths:
      - ".github/workflows/sdk-smoke.yml"
      - ".github/scripts/Invoke-SdkConsumerSmoke.ps1"
      - "analyzers/**"
      - "build/**"
      - "frameworks/**"
      - "installer/scripts/**"
      - "libraries/ApplicationModel/**"
      - "libraries/Connections/**"
      - "libraries/Core/**"
      - "libraries/Hosting/**"
      - "libraries/Http/**"
      - "libraries/ObjectMapping/**"
      - "libraries/Security/Assimalign.Cohesion.Security.DataProtection/**"
      - "resources/ConfigurationStore/Assimalign.Cohesion.ConfigurationStore.ApplicationModel/**"
      - "resources/ConfigurationStore/Assimalign.Cohesion.ConfigurationStore.Client/**"
      - "resources/ConfigurationStore/Assimalign.Cohesion.ConfigurationStore.Hosting/**"
      - "resources/Database/Assimalign.Cohesion.Database.ApplicationModel/**"
      - "resources/Database/Assimalign.Cohesion.Database.Client/**"
      - "resources/Database/Assimalign.Cohesion.Database.Execution/**"
      - "resources/Database/Assimalign.Cohesion.Database.Governance/**"
      - "resources/Database/Assimalign.Cohesion.Database.Hosting/**"
      - "resources/Database/Assimalign.Cohesion.Database.Indexing/**"
      - "resources/Database/Assimalign.Cohesion.Database.Language/**"
      - "resources/Database/Assimalign.Cohesion.Database.Protocol/**"
      - "resources/Database/Assimalign.Cohesion.Database.Security/**"
      - "resources/Database/Assimalign.Cohesion.Database.Storage/**"
      - "resources/Database/Assimalign.Cohesion.Database.Transactions/**"
      - "resources/Database/Assimalign.Cohesion.Database.Types/**"
      - "resources/Database/Assimalign.Cohesion.Database/**"
      - "resources/IdentityHub/Assimalign.Cohesion.IdentityHub.ApplicationModel/**"
      - "resources/IdentityHub/Assimalign.Cohesion.IdentityHub.Client/**"
      - "resources/IdentityHub/Assimalign.Cohesion.IdentityHub.Hosting/**"
      - "resources/Rezolvr/Assimalign.Cohesion.Rezolvr.ApplicationModel/**"
      - "resources/Rezolvr/Assimalign.Cohesion.Rezolvr.Client/**"
      - "resources/Rezolvr/Assimalign.Cohesion.Rezolvr.Hosting/**"
      - "resources/SecretStore/Assimalign.Cohesion.SecretStore.ApplicationModel/**"
      - "resources/SecretStore/Assimalign.Cohesion.SecretStore.Client/**"
      - "resources/SecretStore/Assimalign.Cohesion.SecretStore.Hosting/**"
      - "resources/Web/Assimalign.Cohesion.Web.ApplicationModel/**"
      - "resources/Web/Assimalign.Cohesion.Web.Hosting/**"
      - "resources/Web/Assimalign.Cohesion.Web.Routing/**"
      - "resources/Web/Assimalign.Cohesion.Web/**"
      - "samples/SdkSmoke/**"
      - "sdks/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "global.json"
  workflow_dispatch:

concurrency:
  group: sdk-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  consumer-smoke:
    name: "SDK consumer smoke [${{ matrix.os }}]"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Resolve version and host RID
        id: identity
        shell: pwsh
        run: |
          $version = (& ./installer/scripts/Get-CohesionVersion.ps1).Trim()
          if (-not $version) {
            throw 'Get-CohesionVersion.ps1 produced no version.'
          }

          $rid = @(
            & dotnet --info |
              Select-String -Pattern '^\s*RID:\s*(\S+)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
          ) | Select-Object -First 1
          if (-not $rid) {
            throw "Could not resolve the host RID from 'dotnet --info'."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "rid=$rid" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "SDK consumer identity: $version / $rid"

      - name: Strict-pack SDK and framework closure for host RID
        shell: pwsh
        env:
          COHESION_VERSION: ${{ steps.identity.outputs.version }}
          COHESION_HOST_RID: ${{ steps.identity.outputs.rid }}
        run: |
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $commit) {
            throw 'Resolving the checked-out commit failed.'
          }

          ./installer/scripts/Pack-Release.ps1 `
              -Version $env:COHESION_VERSION `
              -RepositoryCommit $commit `
              -RuntimeIdentifier $env:COHESION_HOST_RID `
              -SkipLibraries

      - name: Build, publish, run, and assert package-only consumers
        shell: pwsh
        env:
          COHESION_VERSION: ${{ steps.identity.outputs.version }}
          COHESION_HOST_RID: ${{ steps.identity.outputs.rid }}
        run: |
          ./.github/scripts/Invoke-SdkConsumerSmoke.ps1 `
              -PackageDirectory ./_out/release/packages `
              -Version $env:COHESION_VERSION `
              -RuntimeIdentifier $env:COHESION_HOST_RID

  sdk-tasks:
    name: "${{ matrix.projects }} [${{ matrix.os }}]"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # These are the source-bearing SDK task projects. Keeping the static
        # project matrix also makes them visible to the release inventory guard.
        projects: [
            "Assimalign.Cohesion.Sdk.Tasks",
            "Assimalign.Cohesion.Sdk.Database.Tasks",
            "Assimalign.Cohesion.Sdk.Gateway.Tasks"
          ]
    steps:
      - name: "Checkout: ${{ matrix.projects }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # Build.CodeGeneration.targets runs a task from build/Tasks inside the Database closure that
      # Sdk.Database.Tasks references; a fresh checkout must build the tasks first (MSB4062 otherwise).
      - name: Build build tasks
        shell: pwsh
        run: |
          dotnet build "./build/Tasks/Assimalign.Cohesion.Build.Tasks.csproj" --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "build/Tasks build failed with exit code $LASTEXITCODE."
          }

      - name: "Build: ${{ matrix.projects }}"
        shell: pwsh
        run: |
          $project = "${{ matrix.projects }}"
          $sdk = $project.Substring(0, $project.Length - ".Tasks".Length)
          dotnet build "./sdks/$sdk/Tasks/src/$project.csproj" --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "$project build failed with exit code $LASTEXITCODE."
          }

  gateway-packages:
    name: Prepare package-boundary feed
    needs: sdk-tasks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Validate release inventory
        shell: pwsh
        run: |
          Import-Module ./installer/scripts/modules/CohesionPackaging.psm1 -Force
          Assert-CohesionReleaseInventory -RepositoryDirectory (Get-Location).Path

      - name: Strict-pack canonical SDK and framework closure
        shell: pwsh
        run: |
          $version = (& ./installer/scripts/Get-CohesionVersion.ps1).Trim()
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $commit) {
            throw 'Resolving the checked-out commit failed.'
          }

          ./installer/scripts/Pack-Release.ps1 `
              -Version $version `
              -RepositoryCommit $commit `
              -RuntimeIdentifier linux-x64,win-x64,osx-arm64 `
              -SkipLibraries

      - name: Pack Gateway package dependency closure
        shell: pwsh
        run: |
          Import-Module ./installer/scripts/modules/CohesionPackaging.psm1 -Force
          $repository = (Get-Location).Path
          $packageDirectory = Join-Path $repository "_out/release/packages"
          $packageIds = @(
            "Assimalign.Cohesion.ApplicationModel"
            "Assimalign.Cohesion.ApplicationModel.Gateway"
            "Assimalign.Cohesion.ApplicationModel.Gateway.ControlPlane"
            "Assimalign.Cohesion.ApplicationModel.Gateway.InProcess"
            "Assimalign.Cohesion.ConfigurationStore.ApplicationModel"
            "Assimalign.Cohesion.ConfigurationStore.Client"
            "Assimalign.Cohesion.Connections"
            "Assimalign.Cohesion.Connections.Tcp"
            "Assimalign.Cohesion.Core"
            "Assimalign.Cohesion.Database"
            "Assimalign.Cohesion.Database.ApplicationModel"
            "Assimalign.Cohesion.Database.Client"
            "Assimalign.Cohesion.Database.Sql.Client"
            "Assimalign.Cohesion.Database.Execution"
            "Assimalign.Cohesion.Database.Governance"
            "Assimalign.Cohesion.Database.Indexing"
            "Assimalign.Cohesion.Database.Language"
            "Assimalign.Cohesion.Database.Protocol"
            "Assimalign.Cohesion.Database.Security"
            "Assimalign.Cohesion.Database.Storage"
            "Assimalign.Cohesion.Database.Transactions"
            "Assimalign.Cohesion.Database.Types"
            "Assimalign.Cohesion.Hosting"
            "Assimalign.Cohesion.Hosting.Health"
            "Assimalign.Cohesion.Hosting.Resources"
            "Assimalign.Cohesion.Http"
            "Assimalign.Cohesion.Http.Connections"
            "Assimalign.Cohesion.IdentityHub.ApplicationModel"
            "Assimalign.Cohesion.IdentityHub.Client"
            "Assimalign.Cohesion.IdentityModel"
            "Assimalign.Cohesion.IdentityModel.Token"
            "Assimalign.Cohesion.IdentityModel.Token.JsonWebToken"
            "Assimalign.Cohesion.LogSpace.ApplicationModel"
            "Assimalign.Cohesion.Rezolvr.ApplicationModel"
            "Assimalign.Cohesion.Rezolvr.Client"
            "Assimalign.Cohesion.SecretStore.ApplicationModel"
            "Assimalign.Cohesion.SecretStore.Client"
            "Assimalign.Cohesion.Security.DataProtection"
            "Assimalign.Cohesion.Web"
            "Assimalign.Cohesion.Web.ApplicationModel"
            "Assimalign.Cohesion.Web.Routing"
          )

          $inventoryById = @{}
          foreach ($item in @(Get-CohesionReleaseLibrary -RepositoryDirectory $repository)) {
            $inventoryById[$item.PackageId] = $item
          }

          $missing = @($packageIds | Where-Object { -not $inventoryById.ContainsKey($_) })
          if ($missing.Count -gt 0) {
            throw "Gateway smoke dependency packages are absent from the release inventory: $($missing -join ', ')."
          }

          foreach ($packageId in $packageIds) {
            $project = $inventoryById[$packageId].ProjectPath
            dotnet pack $project `
                --configuration Release `
                --nologo `
                "-p:PackageOutputPath=$packageDirectory"
            if ($LASTEXITCODE -ne 0) {
              throw "Packing $packageId failed with exit code $LASTEXITCODE."
            }
          }

      - name: Verify package-boundary feed
        shell: pwsh
        run: |
          $version = & ./installer/scripts/Get-CohesionVersion.ps1 -RepoRoot (Get-Location).Path
          $required = @(
            "Assimalign.Cohesion.ApplicationModel"
            "Assimalign.Cohesion.ApplicationModel.Gateway"
            "Assimalign.Cohesion.ApplicationModel.Gateway.ControlPlane"
            "Assimalign.Cohesion.ApplicationModel.Gateway.InProcess"
            "Assimalign.Cohesion.ConfigurationStore.ApplicationModel"
            "Assimalign.Cohesion.ConfigurationStore.Client"
            "Assimalign.Cohesion.Connections"
            "Assimalign.Cohesion.Connections.Tcp"
            "Assimalign.Cohesion.Core"
            "Assimalign.Cohesion.Database"
            "Assimalign.Cohesion.Database.ApplicationModel"
            "Assimalign.Cohesion.Database.Client"
            "Assimalign.Cohesion.Database.Sql.Client"
            "Assimalign.Cohesion.Database.Execution"
            "Assimalign.Cohesion.Database.Governance"
            "Assimalign.Cohesion.Database.Indexing"
            "Assimalign.Cohesion.Database.Language"
            "Assimalign.Cohesion.Database.Protocol"
            "Assimalign.Cohesion.Database.Security"
            "Assimalign.Cohesion.Database.Storage"
            "Assimalign.Cohesion.Database.Transactions"
            "Assimalign.Cohesion.Database.Types"
            "Assimalign.Cohesion.Hosting"
            "Assimalign.Cohesion.Hosting.Health"
            "Assimalign.Cohesion.Hosting.Resources"
            "Assimalign.Cohesion.Http"
            "Assimalign.Cohesion.Http.Connections"
            "Assimalign.Cohesion.IdentityHub.ApplicationModel"
            "Assimalign.Cohesion.IdentityHub.Client"
            "Assimalign.Cohesion.IdentityModel"
            "Assimalign.Cohesion.IdentityModel.Token"
            "Assimalign.Cohesion.IdentityModel.Token.JsonWebToken"
            "Assimalign.Cohesion.LogSpace.ApplicationModel"
            "Assimalign.Cohesion.Rezolvr.ApplicationModel"
            "Assimalign.Cohesion.Rezolvr.Client"
            "Assimalign.Cohesion.Sdk"
            "Assimalign.Cohesion.Sdk.ConfigurationStore"
            "Assimalign.Cohesion.Sdk.Database"
            "Assimalign.Cohesion.Sdk.Gateway"
            "Assimalign.Cohesion.Sdk.IdentityHub"
            "Assimalign.Cohesion.Sdk.LogSpace"
            "Assimalign.Cohesion.Sdk.Rezolvr"
            "Assimalign.Cohesion.Sdk.SecretStore"
            "Assimalign.Cohesion.Sdk.Web"
            "Assimalign.Cohesion.SecretStore.ApplicationModel"
            "Assimalign.Cohesion.SecretStore.Client"
            "Assimalign.Cohesion.Security.DataProtection"
            "Assimalign.Cohesion.Web"
            "Assimalign.Cohesion.Web.ApplicationModel"
            "Assimalign.Cohesion.Web.Routing"
          )
          $missing = @($required | Where-Object {
            -not (Test-Path -LiteralPath "_out/release/packages/$($_).$version.nupkg" -PathType Leaf)
          })
          if ($missing.Count -gt 0) {
            throw "Package-boundary feed is incomplete: $($missing -join ', ')."
          }

      - name: Upload package-boundary feed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-smoke-packages
          path: _out/release/packages/*.nupkg
          if-no-files-found: error
          retention-days: 1

  gateway-smoke:
    name: "Gateway package smoke [${{ matrix.os }}]"
    needs: gateway-packages
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # The Database SDK tests build in-tree Database projects whose value types run a task from
      # build/Tasks; a fresh checkout must build the tasks first (MSB4062 otherwise).
      - name: Build build tasks
        shell: pwsh
        run: |
          dotnet build "./build/Tasks/Assimalign.Cohesion.Build.Tasks.csproj" --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "build/Tasks build failed with exit code $LASTEXITCODE."
          }

      - name: Download package-boundary feed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-smoke-packages
          path: _out/packages

      - name: Run base SDK package-boundary tests
        shell: pwsh
        run: |
          dotnet test `
              ./sdks/Assimalign.Cohesion.Sdk/Tasks/tests/Assimalign.Cohesion.Sdk.Tests.csproj `
              --configuration Release `
              --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "Base SDK package-boundary tests failed with exit code $LASTEXITCODE."
          }

      - name: Run Database SDK tests
        shell: pwsh
        run: |
          dotnet test `
              ./sdks/Assimalign.Cohesion.Sdk.Database/Tasks/tests/Assimalign.Cohesion.Sdk.Database.Tests.csproj `
              --configuration Release `
              --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "Database SDK tests failed with exit code $LASTEXITCODE."
          }

      - name: Run Gateway package-boundary tests
        shell: pwsh
        run: |
          dotnet test `
              ./sdks/Assimalign.Cohesion.Sdk.Gateway/Tasks/tests/Assimalign.Cohesion.Sdk.Gateway.Tests.csproj `
              --configuration Release `
              --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "Gateway package-boundary tests failed with exit code $LASTEXITCODE."
          }

      - name: Publish self-contained Gateway sample
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP "cohesion-gateway-smoke"
          $source = "sdks/Assimalign.Cohesion.Sdk.Gateway/samples/GatewaySmoke"
          $env:NUGET_PACKAGES = Join-Path $workspace ".nuget/packages"
          $env:DOTNET_CLI_HOME = Join-Path $workspace ".dotnet"
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          Copy-Item -Path "$source/*" -Destination $workspace -Recurse -Force
          Copy-Item -LiteralPath global.json -Destination (Join-Path $workspace "global.json") -Force

          $packageFeed = (Resolve-Path -LiteralPath "_out/packages").Path
          $nugetPath = Join-Path $workspace "NuGet.Config"
          [xml] $nuget = Get-Content -LiteralPath $nugetPath -Raw
          $localSource = @($nuget.configuration.packageSources.add) |
              Where-Object { $_.key -eq "cohesion-local" } |
              Select-Object -First 1
          if ($null -eq $localSource) {
            throw "Gateway smoke NuGet.Config has no cohesion-local package source."
          }
          $localSource.value = $packageFeed
          $nuget.Save($nugetPath)

          $publishDirectory = Join-Path $env:RUNNER_TEMP "cohesion-gateway-publish-${{ matrix.rid }}"
          dotnet publish `
              (Join-Path $workspace "Gateway/Gateway.csproj") `
              --configuration Release `
              --runtime "${{ matrix.rid }}" `
              --self-contained true `
              --output $publishDirectory `
              --nologo `
              -p:CohesionGatewayAot=false
          if ($LASTEXITCODE -ne 0) {
            throw "Gateway sample publish failed with exit code $LASTEXITCODE."
          }

      - name: Verify generated surface and run Gateway sample
        shell: pwsh
        run: |
          $gatewayDirectory = Join-Path $env:RUNNER_TEMP "cohesion-gateway-smoke/Gateway"
          $generated = @(
            Get-ChildItem -LiteralPath "$gatewayDirectory/obj/Release" -Recurse -Filter "Gateway.g.cs" -File |
              Sort-Object LastWriteTime -Descending
          )
          if ($generated.Count -eq 0) {
            throw "Sdk.Gateway did not generate Gateway.g.cs."
          }

          $source = Get-Content -LiteralPath $generated[0].FullName -Raw
          foreach ($expected in @("CreateBuilder", "AddAllResources", "UseGateway")) {
            if (-not $source.Contains($expected, [System.StringComparison]::Ordinal)) {
              throw "Generated Gateway.g.cs is missing '$expected'."
            }
          }

          $publishDirectory = Join-Path $env:RUNNER_TEMP "cohesion-gateway-publish-${{ matrix.rid }}"
          $appHost = if ($IsWindows) {
            Join-Path $publishDirectory "Gateway.exe"
          }
          else {
            Join-Path $publishDirectory "Gateway"
          }
          if (-not (Test-Path -LiteralPath $appHost -PathType Leaf)) {
            throw "Published Gateway apphost was not found at '$appHost'."
          }

          $json = (& $appHost --mode describe --gateway local --environment Local | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Published Gateway sample exited with code $LASTEXITCODE."
          }
          $model = $json | ConvertFrom-Json
          if ($model.schema -ne "cohesion/model/v1" -or $model.application -ne "gateway-smoke") {
            throw "Published Gateway sample returned an unexpected model document."
          }
          $web = @($model.resources) | Where-Object { $_.name -eq "gateway-smoke-web" }
          if ($null -eq $web -or @($web.dependencies) -notcontains "gateway-smoke-database") {
            throw "Published Gateway sample omitted the inferred Web-to-Database dependency."
          }

          foreach ($resource in @("gateway-smoke-web", "gateway-smoke-database")) {
            $contentManifest = Join-Path $publishDirectory "cohesion/resources/$resource/.cohesion-resource.json"
            if (-not (Test-Path -LiteralPath $contentManifest -PathType Leaf)) {
              throw "Published Gateway sample omitted the isolated '$resource' content root."
            }
          }

          & $appHost --gateway inprocess --smoke
          if ($LASTEXITCODE -ne 0) {
            throw "Published Gateway in-process smoke exited with code $LASTEXITCODE."
          }

      - name: Publish NativeAOT in-process Gateway sample
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP "cohesion-gateway-smoke"
          $publishDirectory = Join-Path $env:RUNNER_TEMP "cohesion-gateway-publish-aot-linux-x64"
          dotnet publish `
              (Join-Path $workspace "Gateway/Gateway.csproj") `
              --configuration Release `
              --runtime linux-x64 `
              --self-contained true `
              --output $publishDirectory `
              --nologo `
              -p:CohesionGatewayAot=true
          if ($LASTEXITCODE -ne 0) {
            throw "NativeAOT Gateway sample publish failed with exit code $LASTEXITCODE."
          }

          $appHost = Join-Path $publishDirectory "Gateway"
          if (-not (Test-Path -LiteralPath $appHost -PathType Leaf)) {
            throw "NativeAOT Gateway apphost was not found at '$appHost'."
          }

          & $appHost --gateway inprocess --smoke
          if ($LASTEXITCODE -ne 0) {
            throw "NativeAOT Gateway in-process smoke exited with code $LASTEXITCODE."
          }

      - name: Publish NativeAOT in-process Gateway container
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP "cohesion-gateway-smoke"
          $archive = Join-Path $env:RUNNER_TEMP "gateway-smoke-linux-x64.oci.tar.gz"
          dotnet publish `
              (Join-Path $workspace "Gateway/Gateway.csproj") `
              --configuration Release `
              --runtime linux-x64 `
              --self-contained true `
              --nologo `
              -t:PublishContainer `
              -p:EnableSdkContainerSupport=true `
              -p:CohesionGatewayAot=true `
              -p:ContainerImageFormat=OCI `
              "-p:ContainerArchiveOutputPath=$archive" `
              -p:ContainerRepository=gateway-smoke `
              -p:ContainerImageTag=ci
          if ($LASTEXITCODE -ne 0) {
            throw "NativeAOT Gateway container publish failed with exit code $LASTEXITCODE."
          }

          $containerArchive = Get-Item -LiteralPath $archive -ErrorAction Stop
          if ($containerArchive.Length -eq 0) {
            throw "NativeAOT Gateway container archive '$archive' is empty."
          }
