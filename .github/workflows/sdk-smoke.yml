name: SDK Smoke

on:
  push:
    paths:
      - ".github/workflows/sdk-smoke.yml"
      - "scripts/sdks/Invoke-SdkConsumerSmoke.ps1"
      - "analyzers/**"
      - "build/**"
      - "docs/EVENT_SOURCES.md"
      - "scripts/**"
      - "libraries/App/**"
      - "libraries/ApplicationModel/**"
      - "libraries/Cache/**"
      - "libraries/Connections/**"
      - "libraries/Core/**"
      - "libraries/FileSystem/**"
      - "libraries/Hosting/**"
      - "libraries/Http/**"
      - "libraries/IdentityModel/**"
      - "libraries/ObjectMapping/**"
      - "libraries/ObjectValidation/**"
      - "libraries/Security/Assimalign.Cohesion.Security.DataProtection/**"
      - "resources/*/Assimalign.Cohesion.*.Refs/**"
      - "resources/*/Assimalign.Cohesion.*.Runtime/**"
      - "resources/*/Assimalign.Cohesion.*.Hosting.ApplicationModel/**"
      - "resources/ConfigurationStore/Assimalign.Cohesion.ConfigurationStore.Hosting/**"
      - "resources/Database/Assimalign.Cohesion.Database.Client/**"
      - "resources/Database/Assimalign.Cohesion.Database.Execution/**"
      - "resources/Database/Assimalign.Cohesion.Database.Hosting/**"
      - "resources/Database/Assimalign.Cohesion.Database.Indexing/**"
      - "resources/Database/Assimalign.Cohesion.Database.Language/**"
      - "resources/Database/Assimalign.Cohesion.Database.Protocol/**"
      - "resources/Database/Assimalign.Cohesion.Database.Security/**"
      - "resources/Database/Assimalign.Cohesion.Database.Sql*/**"
      - "resources/Database/Assimalign.Cohesion.Database.Storage/**"
      - "resources/Database/Assimalign.Cohesion.Database.Tcp/**"
      - "resources/Database/Assimalign.Cohesion.Database.Transactions/**"
      - "resources/Database/Assimalign.Cohesion.Database.Types/**"
      - "resources/Database/Assimalign.Cohesion.Database/**"
      - "resources/IdentityHub/Assimalign.Cohesion.IdentityHub.Hosting/**"
      - "resources/Rezolvr/Assimalign.Cohesion.Rezolvr.Hosting/**"
      - "resources/SecretStore/Assimalign.Cohesion.SecretStore.Hosting/**"
      - "resources/Web/**"
      - "fixtures/SdkSmoke/**"
      - "sdks/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "global.json"
  pull_request:
    paths:
      - ".github/workflows/sdk-smoke.yml"
      - "scripts/sdks/Invoke-SdkConsumerSmoke.ps1"
      - "analyzers/**"
      - "build/**"
      - "docs/EVENT_SOURCES.md"
      - "scripts/**"
      - "libraries/App/**"
      - "libraries/ApplicationModel/**"
      - "libraries/Cache/**"
      - "libraries/Connections/**"
      - "libraries/Core/**"
      - "libraries/FileSystem/**"
      - "libraries/Hosting/**"
      - "libraries/Http/**"
      - "libraries/IdentityModel/**"
      - "libraries/ObjectMapping/**"
      - "libraries/ObjectValidation/**"
      - "libraries/Security/Assimalign.Cohesion.Security.DataProtection/**"
      - "resources/*/Assimalign.Cohesion.*.Refs/**"
      - "resources/*/Assimalign.Cohesion.*.Runtime/**"
      - "resources/*/Assimalign.Cohesion.*.Hosting.ApplicationModel/**"
      - "resources/ConfigurationStore/Assimalign.Cohesion.ConfigurationStore.Hosting/**"
      - "resources/Database/Assimalign.Cohesion.Database.Client/**"
      - "resources/Database/Assimalign.Cohesion.Database.Execution/**"
      - "resources/Database/Assimalign.Cohesion.Database.Hosting/**"
      - "resources/Database/Assimalign.Cohesion.Database.Indexing/**"
      - "resources/Database/Assimalign.Cohesion.Database.Language/**"
      - "resources/Database/Assimalign.Cohesion.Database.Protocol/**"
      - "resources/Database/Assimalign.Cohesion.Database.Security/**"
      - "resources/Database/Assimalign.Cohesion.Database.Sql*/**"
      - "resources/Database/Assimalign.Cohesion.Database.Storage/**"
      - "resources/Database/Assimalign.Cohesion.Database.Tcp/**"
      - "resources/Database/Assimalign.Cohesion.Database.Transactions/**"
      - "resources/Database/Assimalign.Cohesion.Database.Types/**"
      - "resources/Database/Assimalign.Cohesion.Database/**"
      - "resources/IdentityHub/Assimalign.Cohesion.IdentityHub.Hosting/**"
      - "resources/Rezolvr/Assimalign.Cohesion.Rezolvr.Hosting/**"
      - "resources/SecretStore/Assimalign.Cohesion.SecretStore.Hosting/**"
      - "resources/Web/**"
      - "fixtures/SdkSmoke/**"
      - "sdks/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "global.json"
  workflow_dispatch:
    inputs:
      all-os:
        description: Also run the Windows and macOS legs, which otherwise run only on main.
        type: boolean
        default: false

concurrency:
  group: sdk-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  consumer-smoke:
    name: "SDK consumer smoke [${{ matrix.os }}]"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS legs run on main, or on a manual run with all-os set; other pushes and
        # pull requests run Linux only, because the organization's plan runs at most 5 macOS jobs at once.
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || inputs.all-os) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Resolve version and host RID
        id: identity
        shell: pwsh
        run: |
          $version = (& ./scripts/Get-CohesionVersion.ps1).Trim()
          if (-not $version) {
            throw 'Get-CohesionVersion.ps1 produced no version.'
          }

          $rid = @(
            & dotnet --info |
              Select-String -Pattern '^\s*RID:\s*(\S+)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
          ) | Select-Object -First 1
          if (-not $rid) {
            throw "Could not resolve the host RID from 'dotnet --info'."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "rid=$rid" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "SDK consumer identity: $version / $rid"

      - name: Strict-pack SDK, framework closure, and explicit sample packages for host RID
        shell: pwsh
        env:
          COHESION_VERSION: ${{ steps.identity.outputs.version }}
          COHESION_HOST_RID: ${{ steps.identity.outputs.rid }}
        run: |
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $commit) {
            throw 'Resolving the checked-out commit failed.'
          }

          ./scripts/Pack-Release.ps1 `
              -Version $env:COHESION_VERSION `
              -RepositoryCommit $commit `
              -RuntimeIdentifier $env:COHESION_HOST_RID `
              -SkipLibraries

          # PackageOutputPath must be absolute: MSBuild resolves a relative one against each
          # project's own directory, which packed these two under their src/ folders instead.
          $packageDirectory = Join-Path (Get-Location).Path '_out/release/packages'

          dotnet pack `
              ./libraries/Core/Assimalign.Cohesion.Core/src/Assimalign.Cohesion.Core.csproj `
              --configuration Release `
              --nologo `
              "-p:PackageOutputPath=$packageDirectory"
          if ($LASTEXITCODE -ne 0) {
            throw "Packing Assimalign.Cohesion.Core failed with exit code $LASTEXITCODE."
          }

          dotnet pack `
              ./libraries/ObjectMapping/Assimalign.Cohesion.ObjectMapping/src/Assimalign.Cohesion.ObjectMapping.csproj `
              --configuration Release `
              --nologo `
              "-p:PackageOutputPath=$packageDirectory"
          if ($LASTEXITCODE -ne 0) {
            throw "Packing Assimalign.Cohesion.ObjectMapping failed with exit code $LASTEXITCODE."
          }

      - name: Run framework manifest tests
        shell: pwsh
        run: |
          dotnet test `
              ./libraries/App/Assimalign.Cohesion.App.Runtime/tests/Assimalign.Cohesion.App.Runtime.Tests.csproj `
              --configuration Release `
              --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "Framework manifest tests failed with exit code $LASTEXITCODE."
          }

      - name: Build, publish, run, and assert package-only consumers
        shell: pwsh
        env:
          COHESION_VERSION: ${{ steps.identity.outputs.version }}
          COHESION_HOST_RID: ${{ steps.identity.outputs.rid }}
        run: |
          ./scripts/sdks/Invoke-SdkConsumerSmoke.ps1 `
              -PackageDirectory ./_out/release/packages `
              -Version $env:COHESION_VERSION `
              -RuntimeIdentifier $env:COHESION_HOST_RID

  sdk-tasks:
    name: "SDK tasks [${{ matrix.os }}]"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS legs run on main, or on a manual run with all-os set; other pushes and
        # pull requests run Linux only, because the organization's plan runs at most 5 macOS jobs at once.
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || inputs.all-os) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        # These are the source-bearing SDK task projects. Keeping the static
        # project matrix also makes them visible to the release inventory guard.
        # One leg per OS builds all of them: the inner list is a single matrix value.
        projects: [[
            "Assimalign.Cohesion.Sdk.Tasks",
            "Assimalign.Cohesion.Sdk.Database.Tasks"
          ]]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Build.CodeGeneration.targets runs a task from build/Tasks inside the Database closure that
      # Sdk.Database.Tasks references; a fresh checkout must build the tasks first (MSB4062 otherwise).
      - name: Build build tasks
        shell: pwsh
        run: |
          dotnet build "./build/Tasks/Assimalign.Cohesion.Build.Tasks.csproj" --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "build/Tasks build failed with exit code $LASTEXITCODE."
          }

      - name: Build SDK task projects
        shell: pwsh
        env:
          COHESION_PROJECTS: ${{ toJSON(matrix.projects) }}
        run: |
          # Every project builds even when an earlier one fails, so each reports its own result.
          $failed = foreach ($project in @($env:COHESION_PROJECTS | ConvertFrom-Json)) {
            $sdk = $project.Substring(0, $project.Length - ".Tasks".Length)
            Write-Host "::group::Build $project"
            dotnet build "./sdks/$sdk/Tasks/src/$project.csproj" --configuration Release --nologo | Out-Host
            $exitCode = $LASTEXITCODE
            Write-Host '::endgroup::'
            if ($exitCode -ne 0) {
              Write-Host "::error title=Build failed::$project build failed with exit code $exitCode."
              $project
            }
          }
          if (@($failed).Count -gt 0) {
            throw "$(@($failed).Count) SDK task project(s) failed: $(@($failed) -join ', ')."
          }

  gateway-packages:
    name: Prepare package-boundary feed
    needs: sdk-tasks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate release inventory
        shell: pwsh
        run: |
          Import-Module ./scripts/modules/CohesionPackaging.psm1 -Force
          Assert-CohesionReleaseInventory -RepositoryDirectory (Get-Location).Path

      - name: Strict-pack canonical SDK and framework closure
        shell: pwsh
        run: |
          $version = (& ./scripts/Get-CohesionVersion.ps1).Trim()
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $commit) {
            throw 'Resolving the checked-out commit failed.'
          }

          ./scripts/Pack-Release.ps1 `
              -Version $version `
              -RepositoryCommit $commit `
              -RuntimeIdentifier linux-x64,linux-arm64,win-x64,osx-arm64 `
              -SkipLibraries

      - name: Pack Gateway package dependency closure
        shell: pwsh
        run: |
          Import-Module ./scripts/modules/CohesionPackaging.psm1 -Force
          $repository = (Get-Location).Path
          $packageDirectory = Join-Path $repository "_out/release/packages"
          # The slim Sdk.Gateway references one package, ApplicationModel.Gateway, and its in-process
          # test gateway adds ApplicationModel.Gateway.InProcess, whose Sdk.Web resource references
          # ApplicationModel.Hosting.InProcess; these are those packages and their closure. Core also
          # carries the source generator that binds the in-process programs. No other package-boundary
          # consumer here restores a library package.
          $packageIds = @(
            "Assimalign.Cohesion.ApplicationModel"
            "Assimalign.Cohesion.ApplicationModel.Definition"
            "Assimalign.Cohesion.ApplicationModel.Gateway"
            "Assimalign.Cohesion.ApplicationModel.Gateway.InProcess"
            "Assimalign.Cohesion.ApplicationModel.Hosting"
            "Assimalign.Cohesion.ApplicationModel.Hosting.InProcess"
            "Assimalign.Cohesion.ApplicationModel.Protocol"
            "Assimalign.Cohesion.Core"
            "Assimalign.Cohesion.Hosting"
          )

          $inventoryById = @{}
          foreach ($item in @(Get-CohesionReleaseLibrary -RepositoryDirectory $repository)) {
            $inventoryById[$item.PackageId] = $item
          }

          $missing = @($packageIds | Where-Object { -not $inventoryById.ContainsKey($_) })
          if ($missing.Count -gt 0) {
            throw "Gateway smoke dependency packages are absent from the release inventory: $($missing -join ', ')."
          }

          foreach ($packageId in $packageIds) {
            $project = $inventoryById[$packageId].ProjectPath
            dotnet pack $project `
                --configuration Release `
                --nologo `
                "-p:PackageOutputPath=$packageDirectory"
            if ($LASTEXITCODE -ne 0) {
              throw "Packing $packageId failed with exit code $LASTEXITCODE."
            }
          }

      - name: Verify package-boundary feed
        shell: pwsh
        run: |
          $version = & ./scripts/Get-CohesionVersion.ps1 -RepoRoot (Get-Location).Path
          $required = @(
            "Assimalign.Cohesion.ApplicationModel"
            "Assimalign.Cohesion.ApplicationModel.Definition"
            "Assimalign.Cohesion.ApplicationModel.Gateway"
            "Assimalign.Cohesion.ApplicationModel.Gateway.InProcess"
            "Assimalign.Cohesion.ApplicationModel.Hosting"
            "Assimalign.Cohesion.ApplicationModel.Hosting.InProcess"
            "Assimalign.Cohesion.ApplicationModel.Protocol"
            "Assimalign.Cohesion.Core"
            "Assimalign.Cohesion.Hosting"
            "Assimalign.Cohesion.Sdk"
            "Assimalign.Cohesion.Sdk.Database"
            "Assimalign.Cohesion.Sdk.Gateway"
            "Assimalign.Cohesion.Sdk.Web"
          )
          $missing = @($required | Where-Object {
            -not (Test-Path -LiteralPath "_out/release/packages/$($_).$version.nupkg" -PathType Leaf)
          })
          if ($missing.Count -gt 0) {
            throw "Package-boundary feed is incomplete: $($missing -join ', ')."
          }

      - name: Upload package-boundary feed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-smoke-packages
          path: _out/release/packages/*.nupkg
          if-no-files-found: error
          retention-days: 1

  gateway-smoke:
    name: "SDK package-boundary tests [${{ matrix.os }}]"
    needs: gateway-packages
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS legs run on main, or on a manual run with all-os set; other pushes and
        # pull requests run Linux only, because the organization's plan runs at most 5 macOS jobs at once.
        include: ${{ fromJSON((github.ref == 'refs/heads/main' || inputs.all-os) && '[{"os":"ubuntu-latest","rid":"linux-x64"},{"os":"windows-latest","rid":"win-x64"},{"os":"macos-latest","rid":"osx-arm64"}]' || '[{"os":"ubuntu-latest","rid":"linux-x64"}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The Database SDK tests build in-tree Database projects whose value types run a task from
      # build/Tasks; a fresh checkout must build the tasks first (MSB4062 otherwise).
      - name: Build build tasks
        shell: pwsh
        run: |
          dotnet build "./build/Tasks/Assimalign.Cohesion.Build.Tasks.csproj" --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "build/Tasks build failed with exit code $LASTEXITCODE."
          }

      - name: Download package-boundary feed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-smoke-packages
          path: _out/packages

      - name: Run base SDK package-boundary tests
        shell: pwsh
        run: |
          dotnet test `
              ./sdks/Assimalign.Cohesion.Sdk/Tasks/tests/Assimalign.Cohesion.Sdk.Tests.csproj `
              --configuration Release `
              --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "Base SDK package-boundary tests failed with exit code $LASTEXITCODE."
          }

      # Independent of the base SDK tests above: a failure there must not hide whether the
      # Database schema compiler and migrations still pass.
      - name: Run Database SDK tests
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          dotnet test `
              ./sdks/Assimalign.Cohesion.Sdk.Database/Tasks/tests/Assimalign.Cohesion.Sdk.Database.Tests.csproj `
              --configuration Release `
              --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "Database SDK tests failed with exit code $LASTEXITCODE."
          }

      # The slim Gateway SDK: a package-only consumer compiles against the implicit gateway package, and
      # an in-process consumer binds a top-level Sdk.Web resource from its CohesionResource reference,
      # runs it in process and gets its answer over HTTP (App and App.Web runtime packs come from the
      # gateway-packages job's strict framework pack).
      - name: Run Gateway package-boundary tests
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          dotnet test `
              ./sdks/Assimalign.Cohesion.Sdk.Gateway/Tasks/tests/Assimalign.Cohesion.Sdk.Gateway.Tests.csproj `
              --configuration Release `
              --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "Gateway package-boundary tests failed with exit code $LASTEXITCODE."
          }
