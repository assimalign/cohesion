name: Load Balancer
on:
  push:
    paths:
      - "resources/LoadBalancer/**"
      - ".github/workflows/resource-load-balancer.yml" # When Pipeline File Changes

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects: ["Assimalign.Cohesion.LoadBalancer", "Assimalign.Cohesion.LoadBalancer.Hosting"]
    steps:
      - uses: actions/checkout@v4
        name: "Checkout: ${{ matrix.projects }}"

      - uses: ./.github/actions/build
        name: "Running Build & Tests: ${{ matrix.projects }}"
        with:
          area: "resources"
          category: "LoadBalancer"
          project: ${{ matrix.projects }}
