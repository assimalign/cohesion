name: DependencyInjection
on:
  push:
    paths:
      - "build/TestSupport/**"
      - "libraries/DependencyInjection/**"
      - "!libraries/DependencyInjection/**/*.slnx"
      - "!libraries/DependencyInjection/**/*.md"
      - ".github/workflows/library-dependency-injection.yml" # When Pipeline File Changes
permissions:
  contents: read

jobs:
  build:
    name: "${{ matrix.projects }} [${{ matrix.os }}]"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: false
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects: [
            'Assimalign.Cohesion.DependencyInjection'
          ]
    steps:
      - uses: actions/checkout@v4
        name: "Checkout: ${{ matrix.projects }}"

      - uses: ./.github/actions/build
        name: "Running Build & Tests: ${{ matrix.projects }}"
        with:
          area: 'libraries'
          category: 'DependencyInjection'
          project: ${{ matrix.projects }}
