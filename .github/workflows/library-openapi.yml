name: OpenApi

on:
  push:
    paths:
      - 'libraries/OpenApi/**'
      - '!libraries/OpenApi/**/*.slnx'
      - '!libraries/OpenApi/**/*.md'
      # The source generator ships inside OpenApi.Attributes and runs in the Generation and
      # Integration tests, so a generator change rebuilds and retests the packages that carry it.
      - 'analyzers/Assimalign.Cohesion.SourceGeneration.OpenApi/**'
      - '!analyzers/Assimalign.Cohesion.SourceGeneration.OpenApi/**/*.md'
      - '.github/workflows/library-openapi.yml'                 # When Pipeline File Changes

permissions:
  contents: read

# A newer push to the same branch (or pull request) supersedes this run, so the older run is
# cancelled instead of holding runner slots: the organization's plan runs at most 20 jobs at once,
# 5 of them macOS. Every main commit keeps its own run, because the run id makes its group unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Every leg reports its own result: with fail-fast, one failing leg cancels the rest of the
      # matrix and leaves the other projects without a signal (#1093).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects: [
            'Assimalign.Cohesion.OpenApi',
            'Assimalign.Cohesion.OpenApi.Attributes',
            'Assimalign.Cohesion.OpenApi.Fluent',
            'Assimalign.Cohesion.OpenApi.Generation',
            'Assimalign.Cohesion.OpenApi.Integration',
            'Assimalign.Cohesion.OpenApi.Serialization',
            'Assimalign.Cohesion.OpenApi.Validation',
            'Assimalign.Cohesion.OpenApi.Versioning',
        ]
    steps:
      - uses: actions/checkout@v7
        name: "Checkout: ${{ matrix.projects }}"

      - uses: ./.github/actions/build
        name: "Running Build & Tests: ${{ matrix.projects }}"
        with:
          area: 'libraries'
          category: 'OpenApi'
          project: ${{ matrix.projects }}
