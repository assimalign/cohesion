name: OpenApi

on:
  push:
    paths:
      - 'libraries/OpenApi/**'
      - '!libraries/OpenApi/**/*.slnx'
      - '!libraries/OpenApi/**/*.md'
      # The source generator ships inside OpenApi.Attributes and runs in the Generation and
      # Integration tests, so a generator change rebuilds and retests the packages that carry it.
      - 'analyzers/Assimalign.Cohesion.OpenApi.SourceGeneration/**'
      - '!analyzers/Assimalign.Cohesion.OpenApi.SourceGeneration/**/*.md'
      - '.github/workflows/library-openapi.yml'                 # When Pipeline File Changes

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        projects: [
            'Assimalign.Cohesion.OpenApi',
            'Assimalign.Cohesion.OpenApi.Attributes',
            'Assimalign.Cohesion.OpenApi.Fluent',
            'Assimalign.Cohesion.OpenApi.Generation',
            'Assimalign.Cohesion.OpenApi.Integration',
            'Assimalign.Cohesion.OpenApi.Serialization',
            'Assimalign.Cohesion.OpenApi.Validation',
            'Assimalign.Cohesion.OpenApi.Versioning',
        ]
    steps:
      - uses: actions/checkout@v4
        name: "Checkout: ${{ matrix.projects }}"

      - uses: ./.github/actions/build
        name: "Running Build & Tests: ${{ matrix.projects }}"
        with:
          area: 'libraries'
          category: 'OpenApi'
          project: ${{ matrix.projects }}
