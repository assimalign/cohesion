# The one build recipe every generic Cohesion pipeline runs: restore, build, test. The per-area
# workflows under .github/workflows stay thin (a path filter, the area's project list, and a call
# to this action), so the build logic exists once instead of once per area.
#
# A per-area workflow hands the action its whole project list, so one job per OS restores and
# builds the area once. Building each project in its own job rebuilt the shared reference closure
# once per project, and the organization's plan runs at most 20 jobs at once (5 macOS): Web's 112
# single-project jobs waited 66 to 108 minutes on average to run for 1.5 to 2.5 minutes each.
# The release pipeline still validates one project per leg through the `project` input.
#
# This action does NOT publish. Package publication happens only in .github/workflows/release.yml,
# driven by a published GitHub Release, from the single authoritative inventory in
# installer/scripts/modules/CohesionPackaging.psm1. Publishing from here would have every area
# workflow racing to push a package built from whatever happened to be on main, at a version that
# had passed no release gate.
name: Cohesion Build
description: Restores, builds, and tests a set of Cohesion projects.

inputs:
  area:
    description: The top-level folder that contains the project set, such as libraries.
    required: true
  category:
    description: The category folder under the top-level kind folder. Empty when projects sit directly under the area folder (analyzers).
    required: false
    default: ''
  project:
    description: One project folder and assembly name to build. Give either this or projects.
    required: false
    default: ''
  projects:
    description: A JSON array of project folder and assembly names to build together. Give either this or project.
    required: false
    default: ''
  local-sdk-rids:
    description: Optional comma-separated runtime IDs for bootstrapping local Cohesion SDK and framework packages before restore.
    required: false
    default: ''
  local-sdk-use-canonical-version:
    description: Use the exact canonical package identity for a clean release-validation bootstrap.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install .NET
      # SHA-pinned rather than @v4: this action runs in every CI job in the repository, including
      # the release pipeline's validation gate, and a mutable tag can be repointed at new code.
      # .github/dependabot.yml carries an entry for this directory to keep the pin current.
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        # Install exactly the SDK pinned in global.json (currently the .NET 11
        # preview). Reading the version from global.json keeps CI in lockstep
        # with the repo's pinned SDK so a future bump needs no workflow edit.
        global-json-file: global.json

    - name: Restore build tasks
      shell: pwsh
      run: dotnet restore "./build/Tasks/Assimalign.Cohesion.Build.Tasks.csproj"

    - name: Build build tasks
      shell: pwsh
      run: dotnet build "./build/Tasks/Assimalign.Cohesion.Build.Tasks.csproj" --configuration Release --no-restore

    - name: Pack local SDK and framework closure
      if: ${{ inputs.local-sdk-rids != '' }}
      shell: pwsh
      run: |
        $rids = '${{ inputs.local-sdk-rids }}' -split ','
        $install = @{
          Configuration = 'Release'
          Rids = $rids
          SkipLibraries = $true
        }
        if ('${{ inputs.local-sdk-use-canonical-version }}' -eq 'true') {
          $install.UseCanonicalVersion = $true
        }
        ./installer/scripts/Install-Local.ps1 @install

    - name: Plan ${{ inputs.project || inputs.category || inputs.area }}
      id: plan
      shell: pwsh
      env:
        COHESION_AREA: ${{ inputs.area }}
        COHESION_CATEGORY: ${{ inputs.category }}
        COHESION_PROJECT: ${{ inputs.project }}
        COHESION_PROJECTS: ${{ inputs.projects }}
      # Every project and test project goes into one transient solution for restore and one
      # transient traversal project for build, so each evaluates the shared reference graph once.
      # Both also cover the test projects that do not reference their library (Amqp, EmailHub,
      # Rezolvr, Templates). Build does not use the solution: a solution build unsets
      # Configuration for references outside it (ShouldUnsetParentConfigurationAndPlatform), so
      # they would build as Debug. The traversal hands every project exactly the global
      # properties `dotnet build <project> --configuration Release` would.
      run: |
        $hasProject = -not [string]::IsNullOrWhiteSpace($env:COHESION_PROJECT)
        $hasProjects = -not [string]::IsNullOrWhiteSpace($env:COHESION_PROJECTS)
        if ($hasProject -eq $hasProjects) {
          throw 'Give exactly one of the project and projects inputs.'
        }

        $names = if ($hasProject) { @($env:COHESION_PROJECT) } else { @($env:COHESION_PROJECTS | ConvertFrom-Json) }
        if ($names.Count -eq 0) {
          throw 'The projects input is an empty list.'
        }

        $root = Join-Path (Get-Location).Path $env:COHESION_AREA
        if (-not [string]::IsNullOrWhiteSpace($env:COHESION_CATEGORY)) {
          $root = Join-Path $root $env:COHESION_CATEGORY
        }

        $plan = foreach ($name in $names) {
          $source = Join-Path $root "$name/src/$name.csproj"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "No project at $source."
          }

          $tests = Join-Path $root "$name/tests/$name.Tests.csproj"
          [pscustomobject]@{
            Name   = $name
            Source = $source
            Tests  = if (Test-Path -LiteralPath $tests -PathType Leaf) { $tests } else { $null }
          }
        }

        $paths = @($plan.Source) + @($plan | Where-Object Tests | ForEach-Object Tests)
        $entries = $paths | ForEach-Object { '  <Project Path="{0}" />' -f [System.Security.SecurityElement]::Escape($_) }
        $solution = Join-Path $env:RUNNER_TEMP 'cohesion-build.slnx'
        Set-Content -LiteralPath $solution -Value (@('<Solution>') + $entries + @('</Solution>')) -Encoding utf8

        $items = $paths | ForEach-Object { '    <CohesionBuildProject Include="{0}" />' -f [System.Security.SecurityElement]::Escape($_) }
        $traversal = Join-Path $env:RUNNER_TEMP 'cohesion-build.proj'
        Set-Content -LiteralPath $traversal -Encoding utf8 -Value (@(
          '<Project DefaultTargets="Build">'
          '  <ItemGroup>'
        ) + $items + @(
          '  </ItemGroup>'
          '  <Target Name="Build">'
          '    <MSBuild Projects="@(CohesionBuildProject)" Targets="Build" BuildInParallel="true" />'
          '  </Target>'
          '</Project>'
        ))
        ConvertTo-Json -InputObject @($plan) | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'cohesion-build-plan.json') -Encoding utf8

        Write-Host "Planned $($plan.Count) project(s), $(@($plan | Where-Object Tests).Count) with tests."
        "solution=$solution" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "traversal=$traversal" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Restore
      id: restore
      shell: pwsh
      run: dotnet restore "${{ steps.plan.outputs.solution }}"

    - name: Build
      shell: pwsh
      run: dotnet build "${{ steps.plan.outputs.traversal }}" --configuration Release --no-restore

    - name: Test
      # Runs after a failed build too, so every test project that did build still reports. A test
      # project whose build failed reports as failed here instead of hiding behind the build step.
      if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
      shell: pwsh
      # Recent healthy suites: Http.Connections <= 78 s (run 38563034652), Web.Hosting <= 41 s
      # (38558592445), Templates <= 91 s (38567999644). The five-minute hang timeout applies to
      # each test project; a stuck project is dumped and fails without stopping the others.
      run: |
        $plan = @(Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'cohesion-build-plan.json') -Raw | ConvertFrom-Json)
        $result = [System.Collections.Generic.List[object]]::new()
        foreach ($item in @($plan | Where-Object Tests)) {
          $resultsDirectory = Join-Path 'TestResults' $item.Name
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          Write-Host "::group::Test $($item.Name)"
          dotnet test $item.Tests --configuration Release --no-build `
            --blame-hang-timeout 5m --blame-hang-dump-type mini `
            --results-directory $resultsDirectory `
            --logger "trx;LogFileName=$($item.Name).trx"
          $exitCode = $LASTEXITCODE
          Write-Host '::endgroup::'
          $watch.Stop()

          $counts = 'no results'
          $trx = Join-Path $resultsDirectory "$($item.Name).trx"
          if (Test-Path -LiteralPath $trx -PathType Leaf) {
            $counters = ([xml](Get-Content -LiteralPath $trx -Raw)).TestRun.ResultSummary.Counters
            $skipped = [int]$counters.total - [int]$counters.passed - [int]$counters.failed
            $counts = "$($counters.passed) passed, $($counters.failed) failed, $skipped skipped"
          }

          if ($exitCode -ne 0) {
            Write-Host "::error title=Tests failed::$($item.Name): $counts (exit code $exitCode)."
          }

          $result.Add([pscustomobject]@{
            Name    = $item.Name
            Passed  = $exitCode -eq 0
            Counts  = $counts
            Seconds = [math]::Round($watch.Elapsed.TotalSeconds)
          })
        }

        $failed = @($result | Where-Object { -not $_.Passed })
        $summary = @(
          "### Tests: $($result.Count - $failed.Count) of $($result.Count) project(s) passed"
          ''
          '| Project | Result | Tests | Seconds |'
          '| --- | --- | --- | ---: |'
        )
        foreach ($row in $result) {
          $summary += "| $($row.Name) | $(if ($row.Passed) { 'passed' } else { '**failed**' }) | $($row.Counts) | $($row.Seconds) |"
        }
        $untested = @($plan | Where-Object { -not $_.Tests } | ForEach-Object Name)
        if ($untested.Count -gt 0) {
          $summary += ''
          $summary += "Built without a test project: $($untested -join ', ')."
        }
        $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

        if ($failed.Count -gt 0) {
          throw "$($failed.Count) test project(s) failed: $(@($failed.Name) -join ', ')."
        }

    - name: Upload test hang diagnostics
      if: ${{ failure() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-blame-${{ inputs.project || inputs.category || inputs.area }}-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_attempt }}
        path: |
          TestResults/**/Sequence_*.xml
          TestResults/**/*.dmp
          TestResults/**/*.core
          TestResults/**/core.*
        if-no-files-found: ignore
        retention-days: 7
