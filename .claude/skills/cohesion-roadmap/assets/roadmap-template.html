<title>Data Platform Roadmap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
/* Layout concept: a plan sheet. Sticky band and stage headers over a waterfall whose columns are
   named entry conditions, never dates; lane names ride the left edge; the prose tabs are measured
   columns under the same rules. On a phone the sheet folds into one band summary per lane. */
:root {
  --paper:        #f3f5f8;
  --surface:      #ffffff;
  --surface-2:    #e9ecf1;
  --surface-3:    #dfe3ea;
  --ink:          #141821;
  --ink-2:        #485160;
  --ink-3:        #687180;
  --rule:         #d7dce4;
  --rule-strong:  #aeb7c3;
  --accent:       #2a6fca;
  --t1:           #2a6fca;
  --t2:           #d0561d;
  --t3:           #138a5e;
  --gate:         #3a4454;
  --muted:        #8d96a4;
  --seq:          #8b94a3;
  --attention:    #a05800;
  --critical:     #bb3230;
  --ok:           #1b7c50;
  --shadow:       0 1px 2px rgba(18,24,34,.08), 0 8px 24px rgba(18,24,34,.08);

  --font-display: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --font-body:    'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono:    'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:       #14161b;
    --surface:     #1c1f26;
    --surface-2:   #23272f;
    --surface-3:   #2b3039;
    --ink:         #e9ebef;
    --ink-2:       #b0b8c4;
    --ink-3:       #87909d;
    --rule:        #2e333d;
    --rule-strong: #4a5260;
    --accent:      #4d93e8;
    --t1:          #4d93e8;
    --t2:          #e06a32;
    --t3:          #26b07f;
    --gate:        #9ba6b6;
    --muted:       #6d7684;
    --seq:         #7b8494;
    --attention:   #e2a640;
    --critical:    #ec6b6b;
    --ok:          #3cc489;
    --shadow:      0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper:       #14161b;
  --surface:     #1c1f26;
  --surface-2:   #23272f;
  --surface-3:   #2b3039;
  --ink:         #e9ebef;
  --ink-2:       #b0b8c4;
  --ink-3:       #87909d;
  --rule:        #2e333d;
  --rule-strong: #4a5260;
  --accent:      #4d93e8;
  --t1:          #4d93e8;
  --t2:          #e06a32;
  --t3:          #26b07f;
  --gate:        #9ba6b6;
  --muted:       #6d7684;
  --seq:         #7b8494;
  --attention:   #e2a640;
  --critical:    #ec6b6b;
  --ok:          #3cc489;
  --shadow:      0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
code { font-family: var(--font-mono); font-size: .92em; background: var(--surface-2); padding: 0 4px; border-radius: 3px; }

/* ---------- shell ---------- */
.band { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1880px; margin-inline: auto; min-width: 0; }
.masthead { background: var(--surface); border-bottom: 1px solid var(--rule); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; }
.mast-in { padding-block: 8px 0; display: flex; flex-direction: column; gap: 4px; }
.mast-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; min-width: 0; }
.mast-top h1 { font-size: clamp(18px, 3.4vw, 23px); letter-spacing: -.01em; }
.mast-asof { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); }
.theme-btn { margin-left: auto; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 11px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
@media (max-width: 560px) {
  .mast-asof { display: none; }
  .tabs { overflow-x: visible; }
  .tabs .tab { flex: 1 1 auto; padding: 6px 4px 8px; font-size: 13.5px; text-align: center; }
  .tabs .tab .c { display: none; }
}
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 12px 9px; font-family: var(--font-display); font-size: 14.5px; font-weight: 600; color: var(--ink-3); cursor: pointer; white-space: nowrap; letter-spacing: .01em; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .c { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--ink-3); margin-left: 5px; }
main { padding-block: 4px 48px; }
.mast-sub { font-size: 12px; color: var(--ink-3); font-family: var(--font-mono); line-height: 1.5; padding-block: 8px 10px; }
.mast-sub b { color: var(--ink-2); font-weight: 500; }
section[role="tabpanel"] { animation: fade .18s ease-out; min-width: 0; }
@keyframes fade { from { opacity: .4 } to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

/* ---------- source note: what places the items while the board fields are missing ---------- */
.srcnote { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: start; background: color-mix(in srgb, var(--attention) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--attention) 35%, var(--rule)); border-left: 4px solid var(--attention); border-radius: 0 6px 6px 0; padding: 9px 12px; margin-bottom: 12px; font-size: 13px; color: var(--ink-2); }
.srcnote.ok { border-left-color: var(--ok); background: color-mix(in srgb, var(--ok) 7%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 35%, var(--rule)); }
.srcnote .tag { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--attention); font-weight: 600; padding-top: 2px; }
.srcnote.ok .tag { color: var(--ok); }
.srcnote p { max-width: 110ch; }
@media (max-width: 640px) { .srcnote { grid-template-columns: minmax(0, 1fr); font-size: 12.5px; } }

/* ---------- counts strip ---------- */
.counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
.cnt { background: var(--surface); padding: 8px 11px 9px; min-width: 0; }
.cnt .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
.cnt .v { font-family: var(--font-mono); font-size: 20px; font-weight: 500; line-height: 1.25; font-variant-numeric: tabular-nums; }
.cnt .n { font-size: 11.5px; color: var(--ink-3); line-height: 1.35; }
.cnt.warn .v { color: var(--attention); }
.cnt.crit .v { color: var(--critical); }
@media (max-width: 640px) {
  .counts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cnt { padding: 6px 8px 7px; }
  .cnt .k { font-size: 9.5px; }
  .cnt .v { font-size: 17px; }
  .cnt .n { display: none; }
}

/* ---------- controls ---------- */
.controls { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 0 12px; margin-bottom: 10px; }
.controls[open] { padding-bottom: 12px; }
.controls > .ctl-row { margin-top: 9px; }
.ctl-summary { cursor: pointer; list-style: none; padding: 8px 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; font-family: var(--font-display); font-size: 12.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.ctl-summary::-webkit-details-marker { display: none; }
.ctl-summary::before { content: "\25b8"; color: var(--ink-3); font-size: 10px; }
.controls[open] .ctl-summary::before { content: "\25be"; }
.controls[open] .ctl-summary { border-bottom: 1px dashed var(--rule); }
.ctl-state { font-family: var(--font-mono); font-size: 11px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink-3); min-width: 0; }
.ctl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.ctl-lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; width: 72px; flex: none; }
@media (max-width: 640px) { .ctl-lbl { width: 100%; } }
.chip { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 2.5px 10px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.chip:hover { border-color: var(--rule-strong); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.chip .ct { font-family: var(--font-mono); font-size: 10.5px; opacity: .72; }
.chip.tog[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 3px 12px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--rule-strong); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.search { flex: 1 1 190px; min-width: 0; border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--ink); }
.search::placeholder { color: var(--ink-3); }
.btn-link { background: none; border: 0; color: var(--accent); font-size: 12.5px; cursor: pointer; padding: 2px 4px; text-decoration: underline; text-underline-offset: 2px; }

/* ---------- legend ---------- */
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 16px; font-size: 12px; color: var(--ink-2); padding: 8px 12px 9px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; margin-bottom: 10px; }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg.h { font-weight: 600; color: var(--ink); }
.lgbox { width: 22px; height: 13px; border-radius: 2px; border: 1px solid var(--rule-strong); background: var(--surface); flex: none; position: relative; }
.lgbox.solid { background: color-mix(in srgb, var(--accent) 20%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 45%, var(--surface)); }
.lgbox.hatch { background: color-mix(in srgb, var(--accent) 20%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 45%, var(--surface)); background-image: repeating-linear-gradient(45deg, transparent 0 3px, color-mix(in srgb, var(--accent) 45%, transparent) 3px 4.5px); }
.lgbox.half::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 50%; background: var(--accent); }
.lgbox.ready { border-width: 2px; border-color: var(--ink-2); }
.lgbox.ghost { border-style: dashed; border-color: var(--muted); background: none; }
.lgbox.wave { border: 1.5px dashed var(--ink-3); background: color-mix(in srgb, var(--ink-3) 7%, var(--surface)); }
.lgbox.prio { border: 1.5px dotted var(--ink-3); background: none; }
.lgline { width: 24px; height: 0; border-top: 2px dotted var(--seq); flex: none; }

/* ---------- waterfall ---------- */
.wf-wrap { position: relative; }
.wf-wrap::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 34px; pointer-events: none; border-radius: 0 6px 6px 0; opacity: 0; transition: opacity .15s ease-out; background: linear-gradient(to right, transparent, color-mix(in srgb, var(--paper) 88%, transparent)); }
.wf-wrap.more-right::after { opacity: 1; }
.wf-scroll { overflow: auto; max-height: max(460px, calc(100vh - 250px)); border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.wf { display: grid; position: relative; min-width: max-content; }
.wf-svg { position: absolute; inset: 0; pointer-events: none; z-index: 12; overflow: visible; }
.hdr-band { position: sticky; top: 0; z-index: 20; height: 26px; font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; padding: 0 9px; background: var(--surface-2); color: var(--ink-2); border-bottom: 1px solid var(--rule); border-left: 2px solid var(--rule-strong); display: flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; }
.hdr-band[data-band="t1"] { color: var(--t1); border-left-color: var(--t1); }
.hdr-band[data-band="t2"] { color: var(--t2); border-left-color: var(--t2); }
.hdr-band[data-band="t3"] { color: var(--t3); border-left-color: var(--t3); }
.hdr-band[data-band="gate"] { color: var(--critical); border-left-color: var(--critical); }
.hdr-band[data-band="unplaced"] { color: var(--ink-3); background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--surface-3) 6px 12px); }
.hdr-band > span:first-child { white-space: nowrap; flex: none; }
.hdr-band .def { font-family: var(--font-body); font-size: 10.5px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hdr-stage { position: sticky; z-index: 19; background: var(--surface); height: 108px; overflow: hidden; border-bottom: 1px solid var(--rule-strong); border-left: 1px solid var(--rule); padding: 6px 7px; text-align: left; cursor: pointer; min-width: 0; }
.hdr-stage:hover { background: var(--surface-2); }
.hdr-stage .ix { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); display: block; }
.hdr-stage .nm { font-family: var(--font-display); font-size: 12.5px; font-weight: 600; line-height: 1.2; display: block; }
.hdr-stage .ec { font-size: 10.5px; color: var(--ink-3); line-height: 1.3; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hdr-stage .tog { font-family: var(--font-mono); font-size: 10px; color: var(--accent); margin-top: 3px; display: block; }
.hdr-stage .al { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); display: block; }
.hdr-stage .bf { color: var(--attention); display: block; }
.hdr-stage.band-start { border-left: 2px solid var(--rule-strong); }
.hdr-stage.is-collapsed { background: var(--surface-2); }
.hdr-stage.is-collapsed .nm { font-size: 11px; }
.hdr-stage.narrow { padding: 6px 2px; text-align: center; }
.hdr-stage.narrow .nm { font-family: var(--font-mono); font-size: 11px; }
.hdr-stage .ms { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--ink); background: var(--surface-3); border-radius: 3px; padding: 0 4px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane-hdr { grid-column: 1 / -1; background: var(--surface-2); border-block: 1px solid var(--rule); position: relative; z-index: 2; }
.lane-hdr.epic { background: var(--surface-3); }
.lane-hdr-in { position: sticky; left: 0; width: max-content; max-width: min(100%, 92vw); padding: 4px 10px 5px; display: flex; align-items: center; flex-wrap: wrap; gap: 3px 9px; }
.lane-hdr.is-folded { background: var(--surface); }
.lane-fold { background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: baseline; gap: 6px; font-family: var(--font-display); font-size: 12.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); text-align: left; }
.lane-hdr.cat .lane-fold { text-transform: none; letter-spacing: 0; font-size: 12.5px; }
.lane-fold:hover { color: var(--accent); }
.lane-fold .car { font-size: 9px; color: var(--ink-3); }
.lane-hdr .meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); }
.lane-hdr .code { font-family: var(--font-mono); font-size: 10.5px; color: var(--accent); }
.spark { display: flex; align-items: flex-end; gap: 1px; height: 13px; }
.spark i { width: 5px; background: var(--rule-strong); border-radius: 1px 1px 0 0; min-height: 1px; display: block; }
.spark i[data-b="t1"] { background: var(--t1) } .spark i[data-b="t2"] { background: var(--t2) } .spark i[data-b="t3"] { background: var(--t3) } .spark i[data-b="gate"] { background: var(--critical) }
.cell { padding: 4px; display: flex; flex-direction: column; gap: 3px; min-width: 0; align-self: start; position: relative; z-index: 1; }
.cell.is-collapsed { padding: 4px 2px; align-items: center; }
.cell.narrow { padding: 4px 1px; align-items: center; }
.cell.narrow .cn { min-width: 20px; padding: 0 2px; border-left-width: 2px; }
.colrule { position: absolute; top: 0; width: 1px; background: var(--rule); z-index: 0; pointer-events: none; }
.colrule.is-band { width: 2px; background: var(--rule-strong); }
.colrule.ms { width: 0; border-left: 2px dashed var(--ink-3); background: none; }
.cellcount { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--rule); border-radius: 4px; padding: 2px 7px; cursor: pointer; }
.cellcount:hover { border-color: var(--accent); color: var(--accent); }
.more { font-family: var(--font-mono); font-size: 10.5px; color: var(--accent); background: none; border: 0; cursor: pointer; text-align: left; padding: 1px 2px; }

/* node blocks */
.nd { --tier: var(--muted); display: block; width: 100%; text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--tier); border-radius: 3px; padding: 2px 4px 3px; min-width: 0; position: relative; overflow: hidden; }
.nd:hover { border-color: var(--rule-strong); border-left-color: var(--tier); }
.nd .hd { display: flex; align-items: center; gap: 4px; line-height: 1.4; min-width: 0; }
.nd .id { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.nd .tl { font-size: 10px; line-height: 1.25; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 1px; }
.nd .fl { margin-left: auto; display: inline-flex; gap: 2px; align-items: center; font-family: var(--font-mono); font-size: 9.5px; min-width: 0; overflow: hidden; }
.pill { border-radius: 2px; padding: 0 3px; line-height: 1.5; font-weight: 500; white-space: nowrap; font-family: var(--font-mono); font-size: 9.5px; }
.pill.tier { background: color-mix(in srgb, var(--tier) 18%, var(--surface)); color: color-mix(in srgb, var(--tier) 70%, var(--ink)); }
.pill.cf { background: color-mix(in srgb, var(--attention) 22%, var(--surface)); color: var(--attention); }
.pill.cp { background: var(--ink); color: var(--paper); }
.pill.bk { color: var(--critical); border: 1px solid color-mix(in srgb, var(--critical) 45%, transparent); }
.pill.df { color: var(--critical); background: color-mix(in srgb, var(--critical) 12%, var(--surface)); }
.pill.pre { background: color-mix(in srgb, var(--critical) 14%, var(--surface)); color: var(--critical); }
.wf.narrow .nd .pill.tier, .wf.narrow .nd .pill.bk, .wf.narrow .nd .pill.cp { display: none; }
.nd[data-st="delivered"] { background: color-mix(in srgb, var(--tier) 11%, var(--surface)); border-color: color-mix(in srgb, var(--tier) 28%, var(--rule)); }
.nd[data-st="delivered-unmerged"] { background: color-mix(in srgb, var(--tier) 11%, var(--surface)); border-color: color-mix(in srgb, var(--tier) 28%, var(--rule)); background-image: repeating-linear-gradient(45deg, transparent 0 4px, color-mix(in srgb, var(--tier) 16%, transparent) 4px 6px); }
.nd[data-st="in-progress"]::before { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 50%; background: var(--tier); }
.nd[data-st="in-progress"] { background: color-mix(in srgb, var(--tier) 6%, var(--surface)); }
.nd[data-st="ready"] { border-color: var(--ink-3); border-width: 1.5px; border-left-width: 3px; }
.nd[data-st="unfiled"] { border-style: dashed; border-left-style: solid; background: none; opacity: .92; }
.nd[data-st="unfiled"] .id { font-style: italic; color: var(--ink-3); }
.nd[data-k="feature"], .nd[data-k="program"] { background-color: color-mix(in srgb, var(--tier) 7%, var(--surface-2)); }
.nd[data-k="gate"] { --tier: var(--critical); background: color-mix(in srgb, var(--critical) 6%, var(--surface)); border-style: double; border-width: 3px; border-left-width: 4px; }
.nd[data-win="wave"] { border-style: dashed; }
.nd[data-win="priority"] { border-style: dotted; }
.nd.is-sel { outline: 2px solid var(--ink); outline-offset: 1px; }

<script type="application/json" id="payload">__PAYLOAD__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById('payload').textContent);
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var el = function (tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  var fmt = function (n) { return (n == null ? 0 : n).toLocaleString('en-US'); };
  var ISSUE = 'https://github.com/' + (D.meta.repo || 'assimalign/cohesion') + '/issues/';
  function link(num, text, cls) { var a = el('a', cls || null, text != null ? text : '#' + num); a.href = ISSUE + num; a.target = '_blank'; a.rel = 'noopener'; return a; }

  /* ---------- indexes ---------- */
  var byId = {}, byNum = {};

  var depsIn = {}, depsOut = {};

  var laneById = {}; D.lanes.forEach(function (l) { laneById[l.id] = l; });
  var catById = {}; D.categories.forEach(function (c) { catById[c.id] = c; });
  var progById = {}; (D.programs || []).forEach(function (p) { progById[p.id] = p; });
  var callsBy = {};

  var contraBy = {};
  D.contradictions.forEach(function (c) { (contraBy[c.node] = contraBy[c.node] || []).push(c); });
  var cpSet = {}; (D.criticalPath.chains || []).forEach(function (c) { c.forEach(function (id) { cpSet[id] = 1; }); });
  var nextRank = {}; (D.nextUp.top || []).forEach(function (r, i) { nextRank[r.node] = i + 1; });
  var OFF = D.placement.bandOffsets, SPAN = D.placement.bandSpans;
  var T2S = OFF.t2, T2E = OFF.t2 + SPAN.t2 - 1;
  var ms = D.milestones && D.milestones.t1Complete ? byId[D.milestones.t1Complete.node] : null;

  var TIERS = ['Fix first', 'Prerequisite', 'T1', 'T2', 'T3', 'Done', 'Out', '(none)'];
  var TIERVAR = { 'T1': 'var(--t1)', 'T2': 'var(--t2)', 'T3': 'var(--t3)', 'Fix first': 'var(--gate)', 'Prerequisite': 'var(--gate)', 'Done': 'var(--muted)', 'Out': 'var(--muted)', '(none)': 'var(--muted)' };
  var STATUSES = ['delivered', 'delivered-unmerged', 'in-progress', 'ready', 'backlog', 'unfiled', 'withdrawn', 'out', 'awaiting-evidence'];
  var STLABEL = { 'delivered': 'Merged', 'delivered-unmerged': 'On PR #' + D.meta.integrationPr, 'in-progress': 'In progress', 'ready': 'Ready', 'backlog': 'Backlog', 'unfiled': 'Unfiled slot', 'withdrawn': 'Withdrawn', 'out': 'Out of scope', 'awaiting-evidence': 'Awaiting gate evidence' };
  var PLACES = ['tier', 'tier-inherited', 'prerequisite', 'dependency', 'wave', 'priority', 'bars', 'unplaced', 'landed'];
  var PLLABEL = { 'tier': 'Tier', 'tier-inherited': 'Inherited tier', 'prerequisite': 'Pulled ahead', 'dependency': 'After a dependency', 'wave': 'Wave window', 'priority': 'Priority estimate', 'bars': 'Feature bar', 'unplaced': 'Unplaced', 'landed': 'Landed', 'withdrawn': 'Withdrawn', 'out': 'Out', 'gate': 'Gate', 'milestone': 'Milestone' };
  var BANDNAME = { landed: 'Landed', gate: 'Gates', t1: 'T1 — first-week parity', t2: 'T2 — production depth', t3: 'T3 — competitive depth', unplaced: 'Unplaced' };
  var tierOf = function (n) { return n.tr || '(none)'; };
  var isFooter = function (n) { return n.pl === 'withdrawn' || n.pl === 'out'; };
  var isBar = function (n) { return n.pl === 'bars' && n.se > n.s; };
  var isWin = function (n) { return (n.pl === 'wave' || n.pl === 'priority') && !n.ch; };
  var phoneMQ = window.matchMedia('(max-width: 640px)');

  /* ---------- state ---------- */
  var S = {
    mode: 'language', tier: {}, status: {}, place: {}, q: '',
    slots: true, defects: true, cp: false, t2: false, fit: true, dock: false, dockTouched: false,
    sel: null, collapsed: {}, laneOpen: {}, epicOpen: {}, expanded: {}, catEmptyShown: {}
  };
  S.collapsed[0] = true;
  D.stages.forEach(function (s) { if (s.band === 'unplaced') S.collapsed[s.index] = true; });
  TIERS.forEach(function (t) { S.tier[t] = true; });
  STATUSES.forEach(function (s) { S.status[s] = true; });
  PLACES.forEach(function (p) { S.place[p] = true; });
  D.lanes.forEach(function (l) { S.laneOpen['L:' + l.id] = !l.collapsedByDefault; });
  try { var savedMode = localStorage.getItem('dpr-lanes'); if (savedMode === 'category' || savedMode === 'language') S.mode = savedMode; } catch (e) {}

  /* ---------- masthead ---------- */
  var C = D.counts;
  $('#mast-asof').textContent = 'board read ' + (D.meta.snapshotAt || D.meta.asOf).replace('T', ' ').replace('Z', ' UTC');
  $('#mastsub').innerHTML = 'Generated <b>' + D.meta.generated + '</b> &middot; ' + D.meta.repo + ' Project #' + D.meta.board +
    ' &middot; read-only, <b>nothing on the board was changed</b> &middot; an ordering by tier and dependency, never a calendar &middot; integration PR #' + D.meta.integrationPr;
  $('#c-road').textContent = fmt(C.workItems) + ' items';
  $('#c-tax').textContent = D.taxonomy.categoryCount + ' · ' + D.taxonomy.state;
  var rules = (D.bugPolicy.rules || []);
  $('#c-bug').textContent = rules.length ? rules[0].id + '–' + rules[rules.length - 1].id : '';
  if (D.realign) {
    var rs = D.realign.summary;
    $('#c-chg').textContent = rs.complete ? 'complete' : rs.windowsRun + ' of ' + rs.windowCount + ' windows';
  } else { $('#tab-changes').hidden = true; }

  /* ---------- theme ---------- */
  var themeBtn = $('#theme');
  function readTheme() { try { return localStorage.getItem('dpr-theme') || ''; } catch (e) { return ''; } }
  function applyTheme(t) {
    if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = t === 'dark' ? 'Dark' : t === 'light' ? 'Light' : 'Theme: auto';
  }
  applyTheme(readTheme());
  themeBtn.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') || '';
    var next = cur === '' ? 'light' : cur === 'light' ? 'dark' : '';
    applyTheme(next);
    try { if (next) localStorage.setItem('dpr-theme', next); else localStorage.removeItem('dpr-theme'); } catch (e) {}
    drawEdges();
  });

  /* ---------- source note ---------- */
  (function () {
    var c = D.meta.carried, box = $('#srcnote');
    var allField = !c.categoryFromCarried && !c.programFromCarried;
    if (allField) box.classList.add('ok');
    box.appendChild(el('span', 'tag', allField ? 'Board fields' : 'Carried mapping'));
    var p = el('p');
    p.textContent = c.text + ' Tiers: ' + c.tierFromPlan + ' items from the plan, ' + c.tierFromField + ' from the board field.';
    box.appendChild(p);
  })();

  /* ---------- counts strip: every number reads counts ---------- */
  (function () {
    var box = $('#counts');
    function tile(cls, k, v, n, title) { var d = el('div', 'cnt ' + (cls || '')); d.title = title || (k + ': ' + v + ' — ' + n); d.appendChild(el('div', 'k', k)); d.appendChild(el('div', 'v', v)); d.appendChild(el('div', 'n', n)); box.appendChild(d); }
    var bs = C.byStatus;
    tile('', 'Work items', fmt(C.workItems), C.boardItems + ' on the board less ' + C.containers.total + ' containers');
    tile('', 'Open', fmt(C.open.total), 'open and not delivered');
    tile('', 'Merged', fmt(C.delivered), 'board Done, closed as completed');
    tile('', 'On PR #' + D.meta.integrationPr, fmt(C.deliveredUnmerged), 'In review: written, unmerged');
    tile('', 'In progress', fmt(bs['in-progress'] || 0), 'started');
    tile('', 'Ready', fmt(bs.ready || 0), 'scoped and unblocked');
    tile('', 'Backlog', fmt(bs.backlog || 0), 'filed, not scheduled');
    tile('', 'Unfiled slots', fmt(C.unfiledSlots), 'plan families with no issue');
    var reasons = Object.keys(C.unplaced.byReason || {}).map(function (k) { return C.unplaced.byReason[k] + ' ' + k; }).join('; ');
    tile(C.unplaced.total ? 'warn' : '', 'Unplaced', fmt(C.unplaced.total), C.unplaced.total ? 'no Tier, Wave, Priority or dependency' : 'every item has a place', 'Unplaced: ' + C.unplaced.total + (reasons ? ' — ' + reasons : ''));
    tile('', 'Next up', fmt(C.nextUpTotal), 'open, placed and unblocked');
    tile(C.contradictions ? 'crit' : '', 'Contradictions', fmt(C.contradictions), 'board facts that disagree');
    tile('', 'Withdrawn', fmt(C.withdrawn), 'closed undelivered; never Done');
  })();

  /* ---------- filters ---------- */
  function mkChip(label, sw, count, pressed) {
    var b = el('button', 'chip'); b.type = 'button'; b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
    if (sw) { var s = el('span', 'sw'); s.style.background = sw; b.appendChild(s); }
    b.appendChild(document.createTextNode(label));
    if (count != null) b.appendChild(el('span', 'ct', String(count)));
    return b;
  }
  function countBy(fn, pred) { var m = {}; D.nodes.forEach(function (n) { if (pred && !pred(n)) return; var k = fn(n); m[k] = (m[k] || 0) + 1; }); return m; }
  var itemPred = function (n) { return n.k !== 'milestone'; };
  // Status and placement chips count work items, as the tiles do; tier chips also count the plan's
  // slots, because T2 and T3 are mostly unfiled families. Unfiled slots count themselves.
  var workPred = function (n) { return n.n != null && n.k !== 'gate'; };
  var tierCounts = countBy(tierOf, itemPred), stCounts = countBy(function (n) { return n.st; }, function (n) { return workPred(n) || n.st === 'unfiled'; }), plCounts = countBy(function (n) { return n.pl; }, workPred);
  TIERS.forEach(function (t) {
    if (!tierCounts[t]) return;
    var b = mkChip(t, TIERVAR[t], tierCounts[t], true); b.title = D.legend.tiers[t] || '';
    b.addEventListener('click', function () { S.tier[t] = !S.tier[t]; b.setAttribute('aria-pressed', S.tier[t] ? 'true' : 'false'); render(); });
    $('#f-tier').appendChild(b);
  });
  STATUSES.forEach(function (s) {
    if (!stCounts[s]) return;
    var b = mkChip(STLABEL[s], null, stCounts[s], true); b.title = D.legend.statuses[s] || '';
    b.addEventListener('click', function () { S.status[s] = !S.status[s]; b.setAttribute('aria-pressed', S.status[s] ? 'true' : 'false'); render(); });
    $('#f-status').appendChild(b);
  });
  PLACES.forEach(function (p) {
    if (!plCounts[p]) return;
    var b = mkChip(PLLABEL[p], null, plCounts[p], true); b.title = D.legend.placements[p] || '';
    b.addEventListener('click', function () { S.place[p] = !S.place[p]; b.setAttribute('aria-pressed', S.place[p] ? 'true' : 'false'); render(); });
    $('#f-place').appendChild(b);
  });
  function bindToggle(id, key, after) {
    var b = $('#' + id); b.setAttribute('aria-pressed', S[key] ? 'true' : 'false');
    b.addEventListener('click', function () { S[key] = !S[key]; b.setAttribute('aria-pressed', S[key] ? 'true' : 'false'); if (after) after(); render(); });
  }
  bindToggle('t-slots', 'slots'); bindToggle('t-defects', 'defects'); bindToggle('t-cp', 'cp'); bindToggle('t-t2', 't2'); bindToggle('t-fit', 'fit');
  bindToggle('t-dock', 'dock', function () { S.dockTouched = true; });
  function setMode(m) {
    S.mode = m;
    $('#mode-language').setAttribute('aria-pressed', m === 'language' ? 'true' : 'false');
    $('#mode-category').setAttribute('aria-pressed', m === 'category' ? 'true' : 'false');
    try { localStorage.setItem('dpr-lanes', m); } catch (e) {}
    render();
  }
  $('#mode-language').addEventListener('click', function () { setMode('language'); });
  $('#mode-category').addEventListener('click', function () { setMode('category'); });
  $('#mode-language').setAttribute('aria-pressed', S.mode === 'language' ? 'true' : 'false');
  $('#mode-category').setAttribute('aria-pressed', S.mode === 'category' ? 'true' : 'false');
  $('#f-search').addEventListener('input', function (e) { S.q = e.target.value.trim().toLowerCase(); render(); });
  $('#f-reset').addEventListener('click', function () {
    TIERS.forEach(function (t) { S.tier[t] = true; }); STATUSES.forEach(function (s) { S.status[s] = true; }); PLACES.forEach(function (p) { S.place[p] = true; });
    S.q = ''; S.cp = false; S.slots = true; S.defects = true; S.expanded = {}; $('#f-search').value = '';
    document.querySelectorAll('#f-tier .chip, #f-status .chip, #f-place .chip').forEach(function (b) { b.setAttribute('aria-pressed', 'true'); });
    ['t-slots', 't-defects'].forEach(function (id) { $('#' + id).setAttribute('aria-pressed', 'true'); });
    $('#t-cp').setAttribute('aria-pressed', 'false');
    closeDetail(); render();
  });

  /* ---------- legend ---------- */
  (function () {
    var L = $('#legend');
    function lg(boxCls, text, title, raw) {

      if (title) s.title = title; L.appendChild(s);
    }
    L.appendChild(el('span', 'lg h', 'Fill = status:'));
    lg('solid', 'merged', D.legend.statuses.delivered);
    lg('hatch', 'on PR #' + D.meta.integrationPr, D.legend.statuses['delivered-unmerged']);
    lg('half', 'in progress', D.legend.statuses['in-progress']);
    lg('ready', 'ready', D.legend.statuses.ready);
    lg('', 'backlog', D.legend.statuses.backlog);
    lg('ghost', 'unfiled slot', D.legend.statuses.unfiled);
    L.appendChild(el('span', 'lg h', 'Edge = tier:'));
    ['T1', 'T2', 'T3'].forEach(function (k) { var b = el('span', 'lgbox'); b.style.background = TIERVAR[k]; b.style.borderColor = TIERVAR[k]; b.style.width = '12px'; lg('', k, D.legend.tiers[k], b); });
    var g = el('span', 'lgbox'); g.style.background = 'var(--gate)'; g.style.borderColor = 'var(--gate)'; g.style.width = '12px'; lg('', 'gate band', D.legend.tiers['Fix first'], g);
    L.appendChild(el('span', 'lg h', 'Untiered:'));
    lg('wave', 'Wave window', D.legend.placements.wave);
    lg('prio', 'Priority estimate', D.legend.placements.priority);
    var ln = el('span', 'lgline'); lg('', 'plan order (positions, never blocks)', 'plan-sequence edges', ln);
    var bc = el('span', 'cn bugmark', '#'); bc.style.minWidth = '18px'; bc.style.height = '16px'; lg('', 'red number = defect', 'bug label or issue type Bug', bc);
  })();

  /* ---------- filtering ---------- */
  function visible(n) {
    if (n.k === 'milestone' || isFooter(n)) return false;
    if (!S.tier[tierOf(n)]) return false;
    if (S.status[n.st] === false) return false;
    if (n.pl in S.place && !S.place[n.pl]) return false;
    if (!S.slots && n.k === 'slot') return false;
    if (!S.defects && n.bug) return false;
    if (S.cp && !cpSet[n.i]) return false;
    if (S.q) {
      var c = n.c && catById[n.c] ? catById[n.c].name : '';
      var hay = (n.n != null ? '#' + n.n + ' ' : '') + n.t + ' ' + (n.w || '') + ' ' + (n.fm || '') + ' ' + (n.pg || '') + ' ' + (n.c || '') + ' ' + c;
      if (hay.toLowerCase().indexOf(S.q) < 0) return false;
    }
    return true;
  }

  /* ---------- lanes (language or category) ---------- */
  function laneGroups(vis) {
    // returns [{ kind: 'lane'|'epic', key, name, code?, items[], collapsedDefault }]
    var out = [];
    if (S.mode === 'language') {
      D.lanes.forEach(function (l) {
        var items = vis.filter(function (n) { return n.ln === l.id; });
        var all = D.nodes.filter(function (n) { return n.ln === l.id && n.k !== 'milestone' && !isFooter(n); }).length;
        if (!all) return;
        out.push({ kind: 'lane', key: 'L:' + l.id, name: l.name, epics: l.epicIssues || [], wbs: (l.epics || []).join(' '), items: items, total: all });
      });
      return out;
    }
    var epics = (D.taxonomy.epics || []).slice();
    epics.forEach(function (e) {
      var cats = D.categories.filter(function (c) { return c.epic === e.wbs; });
      var key = 'E:' + e.wbs;
      if (!(key in S.epicOpen)) S.epicOpen[key] = true;
      var epicItems = vis.filter(function (n) { return n.c && catById[n.c] && catById[n.c].epic === e.wbs; });
      out.push({ kind: 'epic', key: key, name: e.title, wbs: e.wbs, issue: e.issue, source: e.source, items: epicItems, cats: cats.length });
      if (!S.epicOpen[key]) return;
      var hiddenEmpty = 0;
      cats.forEach(function (c) {
        var items = vis.filter(function (n) { return n.c === c.id; });
        var all = D.nodes.filter(function (n) { return n.c === c.id && n.k !== 'milestone' && !isFooter(n); }).length;
        if (!all && !S.catEmptyShown[key]) { hiddenEmpty++; return; }
        out.push({ kind: 'lane', cat: true, key: 'C:' + c.id, name: c.name, code: c.id, items: items, total: all, catSource: c.source, issue: c.issue });
      });
      if (hiddenEmpty) out.push({ kind: 'empty', key: key, count: hiddenEmpty });
    });
    var unc = vis.filter(function (n) { return !n.c || !catById[n.c]; });
    var uncAll = D.nodes.filter(function (n) { return (!n.c || !catById[n.c]) && n.k !== 'milestone' && !isFooter(n); }).length;
    if (uncAll) out.push({ kind: 'lane', key: 'C:none', name: 'Uncategorised', items: unc, total: uncAll });
    return out;
  }

  /* ---------- node renderers ---------- */
  var wf = $('#wf');
  var svgNS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(svgNS, 'svg'); svg.setAttribute('class', 'wf-svg'); wf.appendChild(svg);
  function tierVar(n) { return n.k === 'gate' ? 'var(--critical)' : TIERVAR[tierOf(n)]; }
  function nodeBlock(n, asBar) {
    var b = el('button', 'nd' + (asBar ? ' bar' : ''));
    b.type = 'button'; b.dataset.id = n.i; b.dataset.st = n.st; b.dataset.k = n.k;
    if (n.pl === 'wave' || n.pl === 'priority') b.dataset.win = n.pl;
    b.style.setProperty('--tier', tierVar(n));
    if (cpSet[n.i]) b.classList.add('is-cp');

  /* ---------- the waterfall ---------- */
  var CAP = 6, WINCAP = 40;
  function colWidths() {

    });
    var w = FULL;
    if (S.fit && nFull) { var f = Math.floor((avail - fixed) / nFull); if (f < FULL) w = Math.max(f, MIN); }
    return { list: D.stages.map(function (st) { return S.collapsed[st.index] ? COLLAPSED : (st.band === 't2' && !S.t2) ? NARROW : w; }), full: w };
  }
  function render() {
    applyDock();
    var vis = D.nodes.filter(visible);
    var visSet = {}; vis.forEach(function (n) { visSet[n.i] = 1; });

    var cw = colWidths();
    wf.style.gridTemplateColumns = cw.list.map(function (w) { return w + 'px'; }).join(' ');
    wf.classList.toggle('narrow', cw.full < 112);
    Array.prototype.slice.call(wf.children).forEach(function (c) { if (c !== svg) wf.removeChild(c); });
    var row = 1;
    var runs = [];
    D.stages.forEach(function (st) { var last = runs[runs.length - 1]; if (last && last.band === st.band) last.end = st.index; else runs.push({ band: st.band, start: st.index, end: st.index }); });
    runs.forEach(function (r) {
      var h = el('div', 'hdr-band'); h.dataset.band = r.band;
      h.style.gridRow = String(row); h.style.gridColumn = (r.start + 1) + ' / ' + (r.end + 2);
      h.appendChild(el('span', null, BANDNAME[r.band] || r.band));
      var def = '';
      if (r.band === 't1') def = D.legend.tiers.T1;
      else if (r.band === 't2') { var msTxt = ms ? '◆ after T1 complete (' + (D.milestones.t1Complete.remaining || []).length + ' open) · ' : ''; var along = Math.max.apply(null, D.stages.filter(function (s) { return s.band === 't2'; }).map(function (s) { return s.alongsideCount; })); def = msTxt + 'ordered by the plan (D4a) · ' + Object.keys(C.t2.steps).map(function (k) { return k + ' ' + C.t2.steps[k]; }).join(' · ') + ' steps · +' + along + ' scheduled alongside'; }
      else if (r.band === 't3') def = D.legend.tiers.T3;
      else if (r.band === 'gate') def = 'Fix first and Prerequisite items, and untiered work that tiered work waits on';

    });
    row++;
    D.stages.forEach(function (st) {

        h.appendChild(tog);
        if (!S.collapsed[st.index] && st.alongsideCount) h.appendChild(el('span', 'al', '+' + st.alongsideCount + ' scheduled alongside'));
        if (!S.collapsed[st.index] && st.bandFloorCount && (st.band === 'gate' || st.band === 't1')) h.appendChild(el('span', 'bf', st.bandFloorCount + ' of ' + st.nodeCount + ' unordered'));
      }
      if (ms && st.index === ms.s && !narrow) { var m = el('span', 'ms', '◆ T1 complete'); m.title = ms.sx; h.appendChild(m); }
      h.title = st.name + ' — starts when: ' + (st.entryCondition || '') + ' Finished when: ' + (st.exitCondition || '') +
        (st.alongsideCount ? ' ' + st.alongsideCount + ' window-placed items run alongside this column.' : '') +
        (st.bandFloorCount && (st.band === 'gate' || st.band === 't1') ? ' ' + st.bandFloorCount + ' of ' + st.nodeCount + ' items here record no same-band predecessor: unknown ordering, not readiness.' : '') +

        fb.addEventListener('click', function () { S.epicOpen[g.key] = !open; render(); });

        lin.appendChild(el('span', 'meta', g.items.length + ' shown · ' + g.cats + ' categories' + (g.source === 'proposed' ? ' · epic not created yet' : '')));

      em.textContent = 'No items match these filters. Reset, or widen the tier, status and placement selection.';
      wf.appendChild(em);
    }
    paintSelection();
    updateState(vis);

    updateScrollCue();
  }

  function renderLane(g, row) {
    var open = S.laneOpen[g.key] !== false;
    if (!(g.key in S.laneOpen) && g.cat) open = true;
    var lh = el('div', 'lane-hdr' + (g.cat ? ' cat' : '') + (open ? '' : ' is-folded')); lh.style.gridRow = String(row); lh.style.gridColumn = '1 / -1';
    var lhi = el('div', 'lane-hdr-in');
    var fold = el('button', 'lane-fold'); fold.type = 'button'; fold.setAttribute('aria-expanded', open ? 'true' : 'false');
    fold.appendChild(el('span', 'car', open ? '▾' : '▸'));

    lhi.appendChild(el('span', 'meta', g.items.length + ' of ' + g.total + (open ? ' shown' : ' — folded')));
    (g.epics || []).forEach(function (e) { lhi.appendChild(link(e, '#' + e, 'code')); });
    if (g.issue) lhi.appendChild(link(g.issue, '#' + g.issue, 'code'));
    if (g.catSource === 'proposed') lhi.appendChild(el('span', 'meta', 'proposed'));
    var per = D.stages.map(function (st) { return g.items.filter(function (n) { return n.s === st.index && !isBar(n); }).length; });
    var pmax = Math.max.apply(null, per) || 1;
    var sp = el('div', 'spark'); sp.title = 'Where this lane’s work sits, items per stage';
    per.forEach(function (v, i) { var bar = el('i'); bar.dataset.b = D.stages[i].band; bar.style.height = (v ? Math.max(2, Math.round(v / pmax * 13)) : 1) + 'px'; bar.style.opacity = v ? '1' : '.35'; sp.appendChild(bar); });
    lhi.appendChild(sp);
    lh.appendChild(lhi); wf.appendChild(lh);
    row++;
    if (!open) return row;

    var mine = g.items;
    // bars and window groups are packed: spans that do not overlap share a row
    function pack(list, start, end) {
      var rowsEnd = [], at = [];

        if (r < 0) { r = rowsEnd.length; rowsEnd.push(-1); }
        rowsEnd[r] = end(x); at.push(r);
      });
      return { at: at, rows: rowsEnd.length };
    }
    var bars = mine.filter(isBar).sort(function (a, b) { return a.s - b.s || b.se - a.se || (a.n || 0) - (b.n || 0); });
    var bp = pack(bars, function (n) { return n.s; }, function (n) { return n.se; });
    bars.forEach(function (n, i) {
      var holder = el('div'); holder.style.gridRow = String(row + bp.at[i]); holder.style.gridColumn = (n.s + 1) + ' / ' + (n.se + 2);
      holder.style.padding = '2px 4px'; holder.style.minWidth = '0'; holder.style.position = 'relative'; holder.style.zIndex = '1';
      holder.appendChild(nodeBlock(n, true));
      wf.appendChild(holder);
    });
    row += bp.rows;

    var leaves = mine.filter(function (n) { return !isBar(n) && !isWin(n); });
    var any = false;
    D.stages.forEach(function (st) {
      var items = leaves.filter(function (n) { return n.s === st.index; });
      if (!items.length) return;
      any = true;
      var cell = el('div', 'cell'); cell.style.gridRow = String(row); cell.style.gridColumn = String(st.index + 1);

        cell.classList.add('is-collapsed');
        var cc = el('button', 'cellcount', String(items.length)); cc.type = 'button';
        cc.title = items.length + ' item' + (items.length === 1 ? '' : 's') + ' in ' + st.name + ' — expand the column to read them';
        cc.addEventListener('click', function () { S.collapsed[st.index] = false; render(); });
        cell.appendChild(cc); wf.appendChild(cell); return;
      }
      if (st.band === 't2' && !S.t2) {
        cell.classList.add('narrow');
        items.forEach(function (n) { cell.appendChild(chip(n, n.rk ? String(n.rk[1]) : (n.n != null ? String(n.n).slice(-3) : '·'))); });
        wf.appendChild(cell); return;
      }
      var key = g.key + '|' + st.index;
      var cap = S.expanded[key] ? items.length : CAP;
      items.slice(0, cap).forEach(function (n) { cell.appendChild(nodeBlock(n, false)); });
      if (items.length > cap) { var m = el('button', 'more', '+ ' + (items.length - cap) + ' more'); m.type = 'button'; m.addEventListener('click', function () { S.expanded[key] = true; render(); }); cell.appendChild(m); }
      else if (S.expanded[key] && items.length > CAP) { var mc = el('button', 'more', '− fewer'); mc.type = 'button'; mc.addEventListener('click', function () { delete S.expanded[key]; render(); }); cell.appendChild(mc); }
      wf.appendChild(cell);
    });
    if (any) row++;

    // window placements, grouped by window: a cell with a tail across the window

      var k = n.pl + '|' + (n.wf || '') + '|' + n.s + '|' + n.se;

    });
    order.sort(function (a, b) { var x = groups[a], y = groups[b]; return (x.pl === y.pl ? 0 : x.pl === 'wave' ? -1 : 1) || x.s - y.s || y.se - x.se; });
    var wp = pack(order, function (k) { return groups[k].s; }, function (k) { return groups[k].se; });
    order.forEach(function (k, wi) {

      var box = el('div', 'win' + (gr.pl === 'priority' ? ' prio' : ''));
      box.style.gridRow = String(row + wp.at[wi]); box.style.gridColumn = (gr.s + 1) + ' / ' + (gr.se + 2);
      var lab = el('span', 'wl');

      if (gr.items.length > cap) { var m = el('button', 'more', '+ ' + (gr.items.length - cap) + ' more'); m.type = 'button'; m.addEventListener('click', function () { S.expanded[wkey] = true; render(); }); chips.appendChild(m); }
      box.appendChild(chips);
      wf.appendChild(box);
    });
    row += wp.rows;
    return row;
  }

  function updateState(vis) {
    var off = [];
    TIERS.forEach(function (t) { if (tierCounts[t] && !S.tier[t]) off.push(t); });
    STATUSES.forEach(function (s) { if (stCounts[s] && !S.status[s]) off.push(STLABEL[s]); });
    PLACES.forEach(function (p) { if (plCounts[p] && !S.place[p]) off.push(PLLABEL[p]); });
    if (!S.slots) off.push('slots'); if (!S.defects) off.push('defects');

    $('#ctl-state').textContent = (S.mode === 'category' ? 'category lanes · ' : 'language lanes · ') + vis.length + ' of ' + total + ' nodes' + (off.length ? ' · hiding ' + off.slice(0, 4).join(', ') + (off.length > 4 ? ' +' + (off.length - 4) : '') : '');
    $('#wfhint').innerHTML = '<span><b>' + vis.length + '</b> of ' + total + ' nodes shown.</span>' +
      '<span>Click a block or chip: red = what it waits on, blue = what waits on it, grey dots = plan order.</span>' +
      '<span>Click a stage header to fold a column, a lane name to fold a lane.</span><span id="wfscrollhint"></span>';
  }
  function updateScrollCue() {

      hint.style.color = 'var(--attention)';
    } else { hint.textContent = 'Every column is on screen.'; hint.style.color = ''; }
  }

  /* ---------- selection + edges ---------- */
  function paintSelection() {
    var up = {}, down = {};
    if (S.sel) { (depsOut[S.sel] || []).forEach(function (e) { up[e.t] = 1; }); (depsIn[S.sel] || []).forEach(function (e) { down[e.f] = 1; }); }
    wf.querySelectorAll('[data-id]').forEach(function (b) {
      var id = b.dataset.id;
      b.classList.toggle('is-sel', S.sel === id);
      b.classList.toggle('is-up', !!up[id]);
      b.classList.toggle('is-down', !!down[id]);
      b.classList.toggle('dim', !!S.sel && S.sel !== id && !up[id] && !down[id]);
    });
  }
  function rel(node) { var g = wf.getBoundingClientRect(), r = node.getBoundingClientRect(); return { x: r.left - g.left, y: r.top - g.top, w: r.width, h: r.height }; }
  function posOf(id) { var b = wf.querySelector('[data-id="' + id + '"]'); return b ? rel(b) : null; }
  function drawRules() {
    Array.prototype.slice.call(wf.querySelectorAll('.colrule')).forEach(function (r) { wf.removeChild(r); });
    var hdrs = wf.querySelectorAll('.hdr-stage');
    var h = wf.scrollHeight;
    for (var k = 1; k < hdrs.length; k++) {
      var r = el('div', 'colrule');
      if (hdrs[k].classList.contains('band-start')) r.className = 'colrule is-band';
      if (ms && k === ms.s) r.className = 'colrule ms';
      r.style.left = Math.round(rel(hdrs[k]).x) + 'px'; r.style.height = h + 'px';
      wf.appendChild(r);
    }
  }
  function drawEdges() {
    if (phoneMQ.matches) return;
    if (!wf.offsetParent && wf.getBoundingClientRect().width === 0) return;
    drawRules();
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute('width', '0'); svg.setAttribute('height', '0');
    var svgW = wf.scrollWidth, svgH = wf.scrollHeight;
    svg.setAttribute('width', svgW); svg.setAttribute('height', svgH); svg.setAttribute('viewBox', '0 0 ' + svgW + ' ' + svgH);
    var list = [];
    var gateSel = S.sel && byId[S.sel] && byId[S.sel].k === 'gate';
    if (S.sel) (depsOut[S.sel] || []).forEach(function (e) {
      if (e.k === 'gate-member') { if (gateSel) list.push({ f: e.f, t: e.t, c: 'var(--critical)', d: '2 3', w: 1, o: .5 }); return; }
      list.push({ f: e.f, t: e.t, c: e.k === 'plan-sequence' ? 'var(--seq)' : 'var(--critical)', d: e.k === 'plan-sequence' ? '2 3' : '' });
    });
    if (S.sel) (depsIn[S.sel] || []).forEach(function (e) { if (e.k === 'gate-member') return; list.push({ f: e.f, t: e.t, c: e.k === 'plan-sequence' ? 'var(--seq)' : 'var(--accent)', d: e.k === 'plan-sequence' ? '2 3' : '3 3' }); });
    if (S.cp) (D.criticalPath.chains || []).forEach(function (c) { for (var i = 1; i < c.length; i++) list.push({ f: c[i], t: c[i - 1], c: 'var(--ink)', d: '' }); });
    if (S.t2) D.edges.forEach(function (e) { if (e.k === 'plan-sequence') list.push({ f: e.f, t: e.t, c: 'var(--seq)', d: '2 3', w: 1.2, o: .8 }); });
    if (!list.length) return;
    var defs = document.createElementNS(svgNS, 'defs');
    defs.innerHTML = '<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="context-stroke"/></marker>';
    svg.appendChild(defs);
    var seen = {};
    list.forEach(function (e) {
      var key = e.f + '>' + e.t + e.c; if (seen[key]) return; seen[key] = 1;
      var a = posOf(e.t), b = posOf(e.f);
      if (!a || !b) return;
      var x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
      if (x2 < x1) { x1 = a.x; x2 = b.x + b.w; }
      var dx = Math.max(8, Math.min(Math.abs(x2 - x1) * 0.45, 70));
      var p = document.createElementNS(svgNS, 'path');
      p.setAttribute('d', 'M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ' ' + (x2 - dx) + ' ' + y2 + ' ' + x2 + ' ' + y2);
      p.setAttribute('fill', 'none'); p.setAttribute('stroke', e.c); p.setAttribute('stroke-width', String(e.w || 1.6));
      p.setAttribute('opacity', String(e.o || .85)); p.setAttribute('marker-end', 'url(#ah)');
